[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "itutor-core"
version = "0.53.0rc1"
description = "LearnBuddy 学习伙伴 · 可私有部署的个性化 AI 学习系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.50",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
# MCP server（mcp_server.py 暴露 core/tools 给 OpenClaw 等 agent）。
# 仓库保留标准库兼容实现；需要官方 SDK 时可安装该可选依赖。
mcp = [
    "mcp>=1.2; python_version>='3.10'",
]

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
