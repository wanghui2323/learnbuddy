  <text x="84" y="292" class="pg-sub">响应式、6 关自检交互、W2-WN lazy build、推送 dogfood、文档统一</text>
  <text x="84" y="306" class="pg-sub">手机验证码 / 支付 / 积分方案定稿</text>
  <rect x="540" y="266" width="340" height="22" rx="6" class="pg-bar-bg" />
  <rect x="540" y="266" width="210" height="22" rx="6" fill="#d98a3d" />
  <text x="870" y="282" text-anchor="end" class="pg-tag">62%</text>

  <!-- M4 -->
  <rect x="40" y="322" width="860" height="48" rx="10" fill="url(#g-pg-3)" class="pg-card" />
  <circle cx="62" cy="346" r="10" fill="#3d6e9e" />
  <text x="62" y="350" text-anchor="middle" class="pg-tag">M4</text>
  <text x="84" y="344" class="pg-title">差异化深化</text>
  <text x="84" y="360" class="pg-sub">评估闭环、FSRS 调度、周回测、手动调整、prompt 版本化</text>
  <rect x="540" y="336" width="340" height="20" rx="6" class="pg-bar-bg" />
  <rect x="540" y="336" width="68" height="20" rx="6" fill="#3d6e9e" />
  <text x="870" y="351" text-anchor="end" class="pg-tag">20%</text>

  <!-- M5 -->
  <rect x="40" y="380" width="860" height="48" rx="10" fill="url(#g-pg-4)" class="pg-card" />
  <circle cx="62" cy="404" r="10" fill="#7b5ea7" />
  <text x="62" y="408" text-anchor="middle" class="pg-tag">M5</text>
  <text x="84" y="398" class="pg-title">工程与升级模式</text>
  <text x="84" y="414" class="pg-sub">持久会话、备份、安全加固、个人助理模式接入层</text>
  <rect x="540" y="390" width="340" height="20" rx="6" class="pg-bar-bg" />
  <rect x="540" y="390" width="22" height="20" rx="6" fill="#7b5ea7" />
  <text x="870" y="405" text-anchor="end" class="pg-tag">5%</text>

  <!-- 图例 -->
  <text x="40" y="466" class="pg-sub">图例：</text>
  <circle cx="84" cy="462" r="7" fill="#4a9d6e" />
  <text x="98" y="466" class="pg-sub">已完成</text>
  <circle cx="160" cy="462" r="7" fill="#d98a3d" />
  <text x="174" y="466" class="pg-sub">当前在做</text>
  <circle cx="252" cy="462" r="7" fill="#3d6e9e" />
  <text x="266" y="466" class="pg-sub">下一阶段</text>
  <circle cx="344" cy="462" r="7" fill="#7b5ea7" />
  <text x="358" y="466" class="pg-sub">并行准备</text>

  <text x="40" y="502" class="pg-sub">说明：百分比按当前已确认完成的关键产物数量 / 阶段总关键产物估算；详细任务清单见下一节。</text>
</svg>
