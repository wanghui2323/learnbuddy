<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="当前进度总览图">
  <defs>
    <marker id="arr-pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#235955" />
    </marker>
    <linearGradient id="g-pg-1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e7f3ec" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="g-pg-2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbeedd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="g-pg-3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e3edf5" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="g-pg-4" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#efeae0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <style>
    .pg-title { font: 700 14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #235955; }
    .pg-sub { font: 400 11.5px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b6760; }
    .pg-card { stroke: #d8d2c4; stroke-width: 1; }
    .pg-bar-bg { fill: #efeae0; }
    .pg-bar { fill: #2c6e6a; }
    .pg-tag { font: 700 10.5px -apple-system, "PingFang SC", sans-serif; fill: #fff; }
  </style>

  <text x="40" y="36" class="pg-title">当前进度总览（V0.19 → V0.20）</text>
  <text x="40" y="56" class="pg-sub">每个里程碑一行，绿色=已完成，琥珀=当前在做，蓝色=下一阶段，米色=并行准备</text>

  <!-- M0 -->
  <rect x="40" y="78" width="860" height="48" rx="10" fill="url(#g-pg-1)" class="pg-card" />
  <circle cx="62" cy="102" r="10" fill="#4a9d6e" />
  <text x="62" y="106" text-anchor="middle" class="pg-tag">M0</text>
  <text x="84" y="100" class="pg-title">基础跑通</text>
  <text x="84" y="116" class="pg-sub">项目启动、单跑通 demo、首批路径生成</text>
  <rect x="540" y="92" width="340" height="20" rx="6" class="pg-bar-bg" />
  <rect x="540" y="92" width="340" height="20" rx="6" class="pg-bar" />
  <text x="870" y="107" text-anchor="end" class="pg-tag">100%</text>

  <!-- M1 -->
  <rect x="40" y="136" width="860" height="48" rx="10" fill="url(#g-pg-1)" class="pg-card" />
  <circle cx="62" cy="160" r="10" fill="#4a9d6e" />
  <text x="62" y="164" text-anchor="middle" class="pg-tag">M1</text>
  <text x="84" y="158" class="pg-title">学习闭环地基</text>
  <text x="84" y="174" class="pg-sub">登录、路径、学练、学情、图谱、RAG、推荐、记忆、重规划</text>
  <rect x="540" y="150" width="340" height="20" rx="6" class="pg-bar-bg" />
  <rect x="540" y="150" width="340" height="20" rx="6" class="pg-bar" />
  <text x="870" y="165" text-anchor="end" class="pg-tag">100%</text>

  <!-- M2 -->
