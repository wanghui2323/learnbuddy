  <circle cx="62" cy="218" r="10" fill="#4a9d6e" />
  <text x="62" y="222" text-anchor="middle" class="pg-tag">M2</text>
  <text x="84" y="216" class="pg-title">公网可用化</text>
  <text x="84" y="232" class="pg-sub">Web Push 地基、公网 ECS 部署、LearnBuddy 品牌适配</text>
  <rect x="540" y="208" width="340" height="20" rx="6" class="pg-bar-bg" />
  <rect x="540" y="208" width="340" height="20" rx="6" class="pg-bar" />
  <text x="870" y="223" text-anchor="end" class="pg-tag">100%</text>

  <!-- M3 当前在做 -->
  <rect x="40" y="252" width="860" height="60" rx="10" fill="url(#g-pg-2)" class="pg-card" />
  <circle cx="62" cy="282" r="11" fill="#d98a3d" />
  <text x="62" y="286" text-anchor="middle" class="pg-tag">M3</text>
