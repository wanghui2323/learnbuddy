<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LearnBuddy · 学习路径</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2c6e6a">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="/common.js?v=0.50"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-light.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="/common.css">
<style>
  :root {
    --teal: #2c6e6a; --teal-dark: #235955; --teal-soft: #e4efee;
    --amber: #d98a3d; --amber-soft: #fbeedd;
    --paper: #f7f4ee; --paper-2: #efeae0; --card: #ffffff;
    --ink: #2b2926; --ink-soft: #6b6760; --ink-faint: #a39e94;
    --line: #e7e1d6; --red: #c2603f; --red-soft: #f8e8e1; --green: #4a9d6e; --green-soft: #e7f3ec;
    --radius: 16px; --shadow: 0 1px 2px rgba(43,41,38,.05), 0 10px 30px rgba(43,41,38,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    background: var(--paper); color: var(--ink); line-height: 1.65; -webkit-font-smoothing: antialiased; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 184px; background: #fffdf9; border-right: 1px solid var(--line); padding: 16px 14px; position: sticky; top: 56px; height: calc(100vh - 56px); flex-shrink: 0; display: flex; flex-direction: column; }
  .side-label { font-size: 11.5px; font-weight: 700; letter-spacing: .6px; color: var(--ink-faint); text-transform: uppercase; padding: 0 8px 8px; }
  .nav { display: flex; flex-direction: column; gap: 3px; }
  .nav button { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-soft); cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; text-align: left; transition: all .15s; }
  .nav button:hover { background: var(--teal-soft); color: var(--teal-dark); }
  .nav button:focus-visible { outline: 3px solid rgba(44,110,106,.28); outline-offset: 2px; }
  .nav button.active { background: var(--teal); color: #fff; }
  .nav button .ic { width: 18px; height: 18px; flex-shrink: 0; }
  .side-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .side-foot .foot-btn { font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; text-decoration: none; transition: all .15s; border: 1px solid var(--line); color: var(--ink-soft); background: var(--card); }
  .side-foot .foot-btn:hover { border-color: var(--teal); color: var(--teal-dark); background: var(--teal-soft); }
  .side-foot .foot-btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  .side-foot .foot-btn.primary:hover { background: var(--teal-dark); border-color: var(--teal-dark); color: #fff; }

  .main { flex: 1; padding: 22px 32px 72px; max-width: 1120px; }
  .page { display: none; }
  .page.active { display: block; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .ph h1 { font-size: 22px; letter-spacing: 0; }
  .ph p { color: var(--ink-soft); margin-top: 2px; font-size: 13.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(43,41,38,.04); }
  .sec-title { font-size: 15px; font-weight: 800; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .sec-title .bar { width: 4px; height: 16px; border-radius: 3px; background: var(--amber); }
  .section-help { color: var(--ink-soft); font-size: 13px; margin: -4px 0 10px 12px; }
  .pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: var(--paper-2); color: var(--ink-soft); }
  .pill.teal { background: var(--teal-soft); color: var(--teal-dark); } .pill.amber { background: var(--amber-soft); color: var(--amber); } .pill.green { background: var(--green-soft); color: var(--green); }
  .btn { font: inherit; cursor: pointer; border: none; border-radius: 10px; font-weight: 700; padding: 10px 16px; transition: all .15s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn.primary { background: var(--teal); color: #fff; } .btn.primary:hover { background: var(--teal-dark); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); } .btn.ghost:hover { background: var(--paper-2); }
  .btn.sm { padding: 8px 14px; font-size: 13.5px; border-radius: 9px; }
  .btn:disabled { cursor: not-allowed; opacity: .45; filter: grayscale(.25); }
  .btn.primary:disabled:hover { background: var(--teal); }

  /* global top bar (跨页导航始终可见) */
  .topbar { position: sticky; top: 0; z-index: 30; height: 56px; background: #fffdf9; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 20px; }
  .topbar .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(140deg, var(--teal), var(--teal-dark)); color: #fff; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; }
  .crumb { display: flex; align-items: center; gap: 9px; font-size: 14.5px; min-width: 0; }
  .crumb a { color: var(--ink-soft); text-decoration: none; } .crumb a:hover { color: var(--teal-dark); }
  .crumb .sep { color: var(--ink-faint); } .crumb .cur { font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
  .topbar .spacer { flex: 1; }
  .credit-top { font-size: 12.5px; color: var(--ink-soft); background: var(--amber-soft); border: 1px solid #efd2a8; border-radius: 999px; padding: 5px 10px; font-weight: 700; white-space: nowrap; }
  .runtime-mode-top { min-height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 4px 9px; border-radius: 999px; background: var(--paper-2); color: var(--ink-soft); font-size: 11.5px; font-weight: 750; white-space: nowrap; }
  .runtime-mode-top.cloud { background: var(--amber-soft); color: #8a5a1f; }
  .runtime-mode-top.personal { background: var(--teal-soft); color: var(--teal-dark); }

  /* learning home */
  .coach { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 13px; padding: 13px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 1px 2px rgba(43,41,38,.04); }
  .coach .ava { width: 34px; height: 34px; border-radius: 10px; background: var(--teal-soft); color: var(--teal-dark); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .coach .msg { font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); } .coach .msg b { color: var(--teal-dark); }
  .row2 { display: grid; grid-template-columns: 240px 1fr; gap: 12px; margin-top: 12px; align-items: stretch; }
  .ringwrap { display: flex; align-items: center; gap: 12px; }
  .ringtxt .big { font-size: 22px; font-weight: 800; } .ringtxt .lbl { color: var(--ink-soft); font-size: 12.5px; }
  .task { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); margin-bottom: 8px; }
  .task .tic { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--teal-soft); color: var(--teal-dark); }
  .task .tt { flex: 1; } .task .tt .h { font-weight: 700; font-size: 13.5px; } .task .tt .s { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .cta { background: #fff8ea; border: 1px solid #f0d6b0; border-radius: 13px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 12px; }
  .cta .ct { font-size: 13px; color: #8a5a1f; } .cta .ch { font-weight: 700; font-size: 16px; color: var(--ink); }
  .home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 12px; margin-top: 12px; align-items: stretch; }
  .today-main { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(43,41,38,.04); }
  .today-main .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--teal-dark); margin-bottom: 7px; }
  .today-main h2 { font-size: 22px; line-height: 1.28; margin: 0; }
  .today-main p { font-size: 13.5px; color: var(--ink-soft); margin-top: 6px; max-width: 620px; }
  .today-main .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
  .home-next { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 14px; padding: 18px 20px; margin-top: 14px; box-shadow: 0 1px 2px rgba(43,41,38,.04); }
  .home-next-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .home-next .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 850; color: var(--teal-dark); margin-bottom: 7px; }
  .home-next h2 { font-size: 23px; line-height: 1.3; margin: 0; letter-spacing: 0; }
  .home-next p { font-size: 13.5px; color: var(--ink-soft); margin-top: 6px; max-width: 720px; }
  .day-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
  .day-meta span { font-size: 12px; font-weight: 700; color: var(--ink-soft); background: var(--paper-2); border-radius: 999px; padding: 3px 9px; }
  .home-next .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 15px; }
  .week-progress { min-width: 170px; background: #fffdf9; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .week-progress .k { font-size: 11.5px; color: var(--ink-faint); font-weight: 800; }
  .week-progress .v { font-size: 20px; font-weight: 850; line-height: 1.2; margin-top: 3px; }
  .week-progress .track { height: 7px; background: var(--paper-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .week-progress .track span { display: block; height: 100%; background: linear-gradient(90deg,var(--teal),var(--amber)); border-radius: 999px; }
  .week-summary { background: #fffdf9; border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; box-shadow: 0 1px 2px rgba(43,41,38,.04); }
  .week-summary .label { font-size: 12px; font-weight: 800; color: var(--ink-faint); }
  .week-summary .num { font-size: 26px; font-weight: 850; line-height: 1.15; margin-top: 4px; }
  .week-summary .topic { font-size: 13px; color: var(--ink-soft); line-height: 1.45; margin-top: 7px; }
  .week-summary .mini { display: grid; gap: 6px; margin-top: 13px; font-size: 12.5px; color: var(--ink-soft); }
  .week-summary .mini div { display: flex; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .week-summary b { color: var(--ink); }
  .week-plan-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px; box-shadow: 0 1px 2px rgba(43,41,38,.04); }
  .goal-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .goal-list span { font-size: 12.5px; line-height: 1.45; color: var(--teal-dark); background: var(--teal-soft); border-radius: 999px; padding: 4px 9px; }
  .schedule-list { display: grid; gap: 10px; margin-top: 12px; }
  .day-row { position: relative; display: grid; grid-template-columns: 84px 1fr; gap: 14px; padding: 14px 16px 14px 18px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,253,249,.78); box-shadow: 0 1px 2px rgba(43,41,38,.035); overflow: hidden; }
  .day-row::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: #ded8cc; opacity: .9; }
  .day-row.learnable { grid-template-columns: 84px 1fr auto; align-items: center; }
  .day-row.next { border-color: #9fcac5; background: linear-gradient(90deg, rgba(224,242,239,.72), rgba(255,253,249,.92)); box-shadow: 0 7px 22px rgba(44,110,106,.10); }
  .day-row.next::before { background: var(--teal); }
  .day-row.done { background: #f4faf7; border-color: #cfe7d8; }
  .day-row.done::before { background: #1f8a70; }
  .day-row.preparing { border-color: #d8c18f; background: linear-gradient(90deg, #fff7e8, rgba(255,253,249,.92)); }
  .day-row.preparing::before { background: var(--amber); }
  .day-row.locked, .day-row.later, .day-row.preview { background: rgba(255,253,249,.55); }
  .day-row.locked .slot-line, .day-row.later .slot-line, .day-row.preview .slot-line { color: var(--ink-soft); }
  .day-row.done .day, .day-row.done .slot-line { color: var(--ink-faint); }
  .day-row .day { font-size: 12.5px; font-weight: 800; color: var(--ink); }
  .day-row .date { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 600; color: var(--ink-faint); }
  .day-row .day .dno { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 24px; margin-bottom: 5px; border-radius: 999px; color: var(--teal-dark); background: var(--teal-soft); font-size: 11.5px; }
  .day-row.locked .day .dno, .day-row.later .day .dno, .day-row.preview .day .dno { color: var(--ink-soft); background: var(--paper-2); }
  .slot-line { font-size: 13px; line-height: 1.5; color: var(--ink); }
  .slot-line + .slot-line { margin-top: 6px; }
  .slot-line .time { color: var(--teal-dark); font-weight: 800; margin-right: 6px; }
  .slot-line .output { color: var(--ink-faint); margin-left: 6px; }
  .day-state { justify-self: end; display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .day-state.later { background: var(--paper-2); color: var(--ink-faint); }
  .day-state.locked { background: #f4f1ea; color: var(--ink-faint); }
  .day-state.running { background: #fff0cf; color: #7a5a14; }
  .day-state.ready { background: var(--teal-soft); color: var(--teal-dark); }
  .path-loop-note { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid #cfe4df; border-radius: 999px; background: rgba(224,242,239,.72); color: var(--teal-dark); font-size: 12.5px; font-weight: 800; }
  .path-loop-note.warn { border-color: #efd5a4; background: #fff4dc; color: #7a5a14; }
  .path-loop-dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; box-shadow: 0 0 0 4px rgba(44,110,106,.10); }
  .path-loop-dot.spin { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(.78); opacity:.45 } 50% { transform: scale(1); opacity:1 } }
  .plan-overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .plan-overview .s { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; }
  .plan-overview .k { font-size: 12px; color: var(--ink-faint); font-weight: 800; }
  .plan-overview .v { font-size: 15px; font-weight: 850; margin-top: 4px; line-height: 1.4; }
  .stage-plan { display: grid; gap: 14px; margin-top: 16px; }
  .month-section { background: rgba(255,253,249,.58); border: 1px solid var(--line); border-radius: 15px; padding: 14px; }
  .month-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 10px; }
  .month-head h2 { font-size: 16px; margin: 0; line-height: 1.35; }
  .month-head p { font-size: 12.5px; color: var(--ink-soft); line-height: 1.55; margin-top: 4px; }
  .week-list { display: grid; gap: 8px; }
  .week-accordion { background: var(--card); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; box-shadow: 0 1px 2px rgba(43,41,38,.04); }
  .week-accordion.current { border-color: var(--teal); box-shadow: inset 0 3px 0 var(--teal), 0 1px 2px rgba(43,41,38,.04); }
  .week-accordion.locked { opacity: .82; }
  .week-head { width: 100%; border: none; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
  .week-head:hover { background: #fbfefd; }
  .week-chip { font-size: 12px; font-weight: 850; color: var(--teal-dark); background: var(--teal-soft); border-radius: 999px; padding: 3px 8px; margin-top: 1px; }
  .week-accordion.future .week-chip { color: var(--ink-soft); background: var(--paper-2); }
  .week-accordion.locked .week-chip { color: var(--ink-soft); background: var(--paper-2); }
  .week-title { font-size: 15px; line-height: 1.35; font-weight: 850; }
  .week-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .week-state { font-size: 12px; color: var(--ink-faint); font-weight: 800; white-space: nowrap; }
  .week-accordion.current .week-state { color: var(--teal); }
  .week-accordion.unlocked .week-state { color: var(--teal-dark); }
  .week-accordion.locked .week-state { color: var(--ink-faint); }
  .week-detail { padding: 0 16px 15px 58px; }
  .week-detail-inner { border-top: 1px dashed var(--line); padding-top: 12px; }
  .week-detail h3 { font-size: 13px; margin: 0 0 7px; }
  .week-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .plan-hint { font-size: 12px; color: var(--ink-faint); margin-top: 10px; }

  /* path */
  .week { display: flex; gap: 14px; }
  .week .no { width: 48px; flex-shrink: 0; text-align: right; padding-top: 14px; color: var(--ink-faint); font-size: 12px; font-weight: 600; }
  .week .body { flex: 1; border-left: 2px solid var(--line); padding: 0 0 18px 20px; position: relative; }
  .week .body::before { content: ""; position: absolute; left: -7px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--line); border: 2px solid var(--paper); }
  .week.done .body::before { background: var(--green); } .week.now .body::before { background: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
  .week .wc { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 14px 17px; cursor: pointer; transition: all .15s; }
  .week .wc:hover { border-color: var(--teal); box-shadow: 0 6px 16px rgba(44,110,106,.1); }
  .week.now .wc { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
  .week.studied .wc { background: #f4f9f6; border-color: #cfe7d8; }
  .week .wt { font-weight: 600; font-size: 14.5px; padding-right: 58px; } .week .wd { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .week.studied .wt { color: var(--ink-soft); }
  .week .wo { font-size: 12.5px; color: var(--ink-soft); margin-top: 7px; }
  .week .go { font-size: 12px; color: var(--teal); margin-top: 8px; font-weight: 600; }
  .week .go.review { color: var(--ink-faint); }
  .wk-badge { position: absolute; top: 13px; right: 14px; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
  .wk-badge.done { background: #e7f3ec; color: var(--green); }
  .wk-badge.now { background: var(--amber-soft); color: var(--amber); }
  .wk-badge.todo { background: var(--paper-2); color: var(--ink-faint); }
  .editbar { display:flex; justify-content:flex-end; margin:0 0 14px; }
  .srcs { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; opacity:.72; }
  .cnode:hover .srcs { opacity:1; }
  .src { font-size:11.5px; border:1px solid var(--line); background:#fffdf9; color:var(--ink-soft); border-radius:999px; padding:2px 8px; text-decoration:none; }
  .src:hover { color:var(--teal-dark); border-color:var(--teal); }
  .src-edit { font-size:11px; color:var(--ink-faint); border:none; background:transparent; cursor:pointer; font-weight:700; padding:2px 4px; }
  .src-edit:hover { color:var(--teal); }

  /* analytics */
  .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .stat .s { background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 16px 18px; }
  .stat .s .k { font-size: 12.5px; color: var(--ink-faint); } .stat .s .v { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .note { background: var(--paper-2); border-radius: 11px; padding: 13px 16px; font-size: 13px; color: var(--ink-soft); margin-top: 14px; }
  .insight { background: linear-gradient(135deg, var(--teal-soft), var(--card)); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 14px; padding: 16px 18px; margin-top: 16px; }
  .insight .label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; color: var(--teal-dark); margin-bottom: 6px; }
  .insight .text { font-size: 15px; font-weight: 700; line-height: 1.65; }
  .insight .sub { font-size: 13px; color: var(--ink-soft); line-height: 1.6; margin-top: 4px; }

  .kbform input, .kbform textarea { width: 100%; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 12px; font: inherit; font-size: 14px; background: var(--card); margin-top: 8px; }
  .kbform textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
  .kbform input:focus, .kbform textarea:focus { outline: none; border-color: var(--teal); }

  @media (max-width: 820px) {
    .layout { display: block; }
    .sidebar { position: static; width: auto; height: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 10px 14px; }
    .side-label, .side-foot { display: none; }
    .nav { flex-direction: row; overflow-x: auto; }
    .nav button { width: auto; flex: 0 0 auto; white-space: nowrap; }
    .main { padding: 18px 16px 64px; }
    .profile-grid, .analysis-grid, .course-visual-grid, .home-grid, .plan-overview { grid-template-columns: 1fr; }
    .lesson-focus, .concept-grid, .produce-grid, .summary-grid, .design-brief { grid-template-columns: 1fr; }
    .lesson-head { display: block; }
    .lesson-head .s { display: inline-flex; margin-top: 8px; }
    .lesson-rail { overflow-x: auto; }
    .rail-step { flex: 0 0 92px; }
    .agent-stage { padding: 18px 14px; }
    .agent-head { grid-template-columns: 42px minmax(0, 1fr); align-items: start; }
    .agent-orb { width: 38px; height: 38px; border-radius: 13px; }
    .agent-time { grid-column: 2; justify-self: start; margin-top: -4px; }
    .agent-step { grid-template-columns: 28px minmax(0, 1fr); }
    .agent-step .state { grid-column: 2; justify-self: start; }
    .radar-wrap { grid-template-columns: 1fr; }
    .course-metrics { grid-template-columns: 1fr; }
    .week-head { grid-template-columns: auto 1fr; }
    .week-state { grid-column: 2; }
    .week-detail { padding-left: 16px; }
    .day-row, .day-row.learnable { grid-template-columns: 1fr; gap: 8px; padding: 13px 14px 13px 16px; }
    .day-state, .day-row .btn { justify-self: start; }
    .topbar .btn { display: none; }
    .crumb .cur { max-width: 58vw; }

  }
  @media (max-width: 520px) {
    .topbar { padding-inline: 12px; gap: 9px; }
    .crumb .sep, .crumb .cur { display: none; }
  }
</style>

<script>
let DATA = null, INSTANCE_ID = null;
let CURRENT_VIEW = 'home';
let PATH_LOOP_POLL = null;
let SERVER_STUDIED = new Set();   // 服务端已学主题（跨设备）
let ANALYTICS = null;             // 学情数据包缓存
let REPLAN = null;                // 动态重规划检测 + 提案生命周期
let INSTANCE_RUNTIME = { edition: 'legacy', quota_mode: 'platform', source: 'fallback' };

function applyInstanceRuntime(runtime) {
  INSTANCE_RUNTIME = runtime || INSTANCE_RUNTIME;
  const badge = document.getElementById('instanceRuntimeMode');
  badge.className = 'runtime-mode-top';
  if (INSTANCE_RUNTIME.edition === 'cloud') {
    badge.textContent = '在线体验';
    badge.classList.add('cloud');
  } else if (INSTANCE_RUNTIME.edition === 'personal') {
    badge.textContent = '我的 LearnBuddy';
    badge.classList.add('personal');
    document.getElementById('creditTop').style.display = 'none';
  } else {
    badge.textContent = '兼容模式';
  }
  return INSTANCE_RUNTIME;
}

const instanceRuntimeReady = window.LearnBuddyRuntime
  ? window.LearnBuddyRuntime.load().then(applyInstanceRuntime)
  : Promise.resolve(applyInstanceRuntime(INSTANCE_RUNTIME));

const ICONS = {
  play:'<path d="M7 4v16l13-8z"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  scroll:'<path d="M8 2h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8M8 2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2M8 2a2 2 0 0 1 2 2v12M4 6h2M4 10h2"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
  bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  warn:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  arrowRight:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  cap:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.1 2.7 2.5 6 2.5s6-1.4 6-2.5v-5"/><path d="M22 10v6"/>',
  xcircle:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',
  cards:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 14.5h7"/>',
  archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M9.5 12h5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  flag:'<path d="M4 22V4M4 4h13l-2.5 4L17 12H4"/>',
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  up:'<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.3a2 2 0 0 0 2-1.7l1.4-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>',
  down:'<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7l-1.4 9a2 2 0 0 0 2 2.3zM17 2h2.7A2 2 0 0 1 22 4v7a2 2 0 0 1-2 2h-3"/>',
};
function icon(name, size=16){ return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.18em" aria-hidden="true">${ICONS[name]||''}</svg>`; }

function getId() { const m = location.pathname.match(/\/instance\/([^/?#]+)/); return m ? m[1] : null; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
if (window.marked) marked.setOptions({ breaks: true, gfm: true });
function md(t){ return window.renderSafeMarkdown ? window.renderSafeMarkdown(t, false) : esc(t); }
function mdi(t){ return window.renderSafeMarkdown ? window.renderSafeMarkdown(t, true) : esc(t); }
function hl(root){ try { (root||document).querySelectorAll('pre code').forEach(b => hljs.highlightElement(b)); } catch(e){} }
let RUNNO_LOAD_PROMISE = null;
function ensureRunno() {
  if (window.__runnoReady === true) return Promise.resolve(true);
  if (window.__runnoReady === false) return Promise.resolve(false);
  if (!RUNNO_LOAD_PROMISE) {
    RUNNO_LOAD_PROMISE = import("https://cdn.jsdelivr.net/npm/@runno/runtime/+esm")
      .then(() => { window.__runnoReady = true; return true; })
      .catch((e) => { window.__runnoReady = false; console.warn("Runno 加载失败，将降级为静态代码块", e); return false; });
  }
  return RUNNO_LOAD_PROMISE;
}
function lessonsDone(){ return parseInt(localStorage.getItem('itutor_lessons_'+INSTANCE_ID) || '0', 10); }
function addLessonDone(){ localStorage.setItem('itutor_lessons_'+INSTANCE_ID, String(lessonsDone()+1)); }
function doneTopics(){ const s = new Set(SERVER_STUDIED); try { JSON.parse(localStorage.getItem('itutor_topics_'+INSTANCE_ID) || '[]').forEach(t=>s.add(t)); } catch(e){} return s; }
async function loadAnalytics(force){
  if (ANALYTICS && !force) return ANALYTICS;
  try {
    const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/analytics`);
    if (res.ok) { ANALYTICS = await res.json(); (ANALYTICS.topics||[]).forEach(t=>SERVER_STUDIED.add(t.topic)); }
  } catch(e){}
  return ANALYTICS;
}
function isTopicDone(t){ return doneTopics().has(t); }
function markTopicDone(t){ if(!t) return; const s = doneTopics(); s.add(t); localStorage.setItem('itutor_topics_'+INSTANCE_ID, JSON.stringify([...s])); }
function pathLoop(){ return (DATA && DATA.path_loop && typeof DATA.path_loop === 'object') ? DATA.path_loop : {}; }
function pathUnits(){ const units = pathLoop().units; return Array.isArray(units) ? units : []; }
function pathPreGen(){ const p = pathLoop().pre_generation; return (p && typeof p === 'object') ? p : {}; }
function unitForDay(wk, day) {
  if (!wk || !day) return null;
  return pathUnits().find(u => Number(u.week) === Number(wk.week) && Number(u.day) === Number(day.day)) || null;
}
function isUnitDone(unit) {
  if (!unit) return false;
  if (unit.completed) return true;
  const ids = new Set(pathLoop().completed_unit_ids || []);
  return ids.has(unit.unit_id);
}
function preGenMatches(topicOrUnit) {
  const p = pathPreGen();
  if (!p.topic && !p.unit_id) return false;
  if (typeof topicOrUnit === 'string') return p.topic === topicOrUnit;
  return topicOrUnit && (p.unit_id === topicOrUnit.unit_id || p.topic === topicOrUnit.topic);
}
function preGenBusy() {
  return ['queued', 'running', 'generating'].includes(String(pathPreGen().status || ''));
}
function preGenStatusHtml(topicOrUnit) {
  const p = pathPreGen();
  if (!preGenMatches(topicOrUnit)) return '';
  const status = String(p.status || '');
  if (['queued', 'running', 'generating'].includes(status)) {
    const label = p.stage_label || '准备中';
    const pct = p.progress_percent ? ` · ${p.progress_percent}%` : '';
    return `<div class="path-loop-note warn"><span class="path-loop-dot spin"></span> 正在准备这一天：${esc(label)}${pct}</div>`;
  }
  if (status === 'succeeded') {
    return `<div class="path-loop-note"><span class="path-loop-dot"></span> 这一天已准备好，打开会直接进入学习。</div>`;
  }
  if (status === 'failed' || status === 'skipped') {
    return `<div class="path-loop-note warn"><span class="path-loop-dot"></span> ${esc(p.detail || p.error || '自动准备没有完成，可以点进当天手动生成。')}</div>`;
  }
  return '';
}
async function loadPathLoop(force=false) {
  if (!force && DATA && DATA.path_loop && !preGenBusy()) return DATA.path_loop;
  try {
    const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/path-loop`);
    if (res.ok) DATA.path_loop = await res.json();
  } catch(e) {}
  return DATA.path_loop || {};
}
function renderCurrentViewPreserveScroll() {
  const y = window.scrollY;
  document.getElementById('main').innerHTML = `<div class="page active">${VIEWS[CURRENT_VIEW]()}</div>`;
  if (CURRENT_VIEW === 'home') initHome();
  if (CURRENT_VIEW === 'path') initPath();
  window.scrollTo(0, y);
}
function schedulePathLoopPoll() {
  if (PATH_LOOP_POLL) {
    window.clearInterval(PATH_LOOP_POLL);
    PATH_LOOP_POLL = null;
  }
  if (!preGenBusy()) return;
  PATH_LOOP_POLL = window.setInterval(async () => {
    const before = JSON.stringify(pathPreGen());
    await loadPathLoop(true);
    const after = JSON.stringify(pathPreGen());
    if (['home', 'path'].includes(CURRENT_VIEW) && before !== after) renderCurrentViewPreserveScroll();
    if (!preGenBusy()) {
      window.clearInterval(PATH_LOOP_POLL);
      PATH_LOOP_POLL = null;
    }
  }, 2500);
}

function masterWeeks() { return DATA.master.weeks || []; }
function weekByNumber(w) {
  const hit = masterWeeks().find(x => Number(x.week) === Number(w));
  if (hit) return hit;
  const plan = detailedWeekPlan(w);
  const fallback = (DATA.master.north_star || {}).domain || '学习计划';
  return plan ? { week: Number(plan.week || w), title: plan.title || fallback, key_outcomes: plan.key_outcomes || [] } : null;
}
function weekTheme(w) { const hit = weekByNumber(w); return hit ? hit.title : (DATA.master.north_star||{}).domain; }
function hasWeekPlan(week) { return !!detailedWeekPlan(week); }
function firstPlannedWeek() {
  const hit = masterWeeks().find(wk => hasWeekPlan(wk.week));
  return hit ? Number(hit.week) : 1;
}
function isWeekUnlocked(week) {
  return hasWeekPlan(week);
}
function weekDays(week) {
  const plan = detailedWeekPlan(week);
  return plan ? (plan.days || []) : [];
}
function weekGoals(wk) {
  return (wk && wk.key_outcomes || []).map(x => String(x || '').trim()).filter(Boolean);
}
function weekDisplayDays(wk) {
  return weekDays(wk.week);
}
function primarySlot(day) {
  const slots = day && day.slots || [];
  return slots[0] || {};
}
function cleanDayTask(task) {
  return String(task || '')
    .replace(/^推进新内容[：:]\s*/, '')
    .replace(/^轻量消化[：:]\s*/, '')
    .replace(/^巩固 \+ 输出[：:]\s*/, '')
    .replace(/^实战 \+ 错题[：:]\s*/, '')
    .trim();
}
function dayTitle(day) {
  if (!day) return '继续学习';
  return day.title || day.topic || cleanDayTask(primarySlot(day).task) || `第 ${day.day || ''} 天学习`;
}
function dayDisplayTitle(wk, day) {
  if (day && (day.topic || day.title)) return dayTitle(day);
  return (wk && wk.title) || weekTheme(wk && wk.week) || dayTitle(day);
}
function legacyDayTopic(wk, day) {
  const base = dayTitle(day);
  const prefix = `${wk && wk.title ? wk.title : weekTheme(wk && wk.week)} · D${day.day || ''}`;
  return `${prefix} ${base}`.trim();
}
function dayTopic(wk, day) {
  if (day && (day.topic || day.title)) return dayTitle(day);
  return (wk && wk.title) || weekTheme(wk && wk.week) || dayTitle(day);
}
function sameDay(a, b) {
  if (!a || !b) return false;
  if (a.day != null && b.day != null) return Number(a.day) === Number(b.day);
  return String(a.date || dayTitle(a)) === String(b.date || dayTitle(b));
}
function isDayDone(wk, day) {
  const unit = unitForDay(wk, day);
  if (unit) return isUnitDone(unit);
  return isTopicDone(dayTopic(wk, day)) || isTopicDone(legacyDayTopic(wk, day));
}
function weekCompletion(wk) {
  const days = weekDays(wk.week);
  const done = days.filter(d => isDayDone(wk, d)).length;
  return { done, total: days.length, completed: !!days.length && done >= days.length, pct: days.length ? Math.round(done / days.length * 100) : 0 };
}
function isWeekDone(wk) {
  const c = weekCompletion(wk);
  return c.total > 0 && c.done >= c.total;
}
function selfCheckForWeek(week) {
  return (DATA.self_checks || []).find(item => Number(item.week) === Number(week)) || null;
}
function selfCheckPassed(week) {
  const item = selfCheckForWeek(week);
  return !!(item && item.passed);
}
function selfCheckUrl(week) {
  return `/self-check/${encodeURIComponent(INSTANCE_ID)}?week=${Number(week)}`;
}
function unlockedWeeks() {
  return masterWeeks().filter(wk => isWeekUnlocked(wk.week));
}
function activeWeekNumber() {
  const unlocked = unlockedWeeks();
  if (!unlocked.length) return 1;
  const open = unlocked.find(wk => !isWeekDone(wk));
  return (open || unlocked[unlocked.length - 1]).week || 1;
}
function curWeek() { return activeWeekNumber(); }
function currentWeekData() {
  return weekByNumber(curWeek()) || masterWeeks()[0] || null;
}
function nextDayEntry(wk) {
  wk = wk || currentWeekData();
  if (!wk) return null;
  const days = weekDays(wk.week);
  if (!days.length) return { wk, day: null, topic: wk.title || weekTheme(wk.week), done: 0, total: 0, pct: 0 };
  const comp = weekCompletion(wk);
  const currentUnit = pathLoop().current_unit;
  if (currentUnit && Number(currentUnit.week) === Number(wk.week)) {
    const unitDay = days.find(d => Number(d.day) === Number(currentUnit.day));
    if (unitDay) return { wk, day: unitDay, topic: currentUnit.topic || dayTopic(wk, unitDay), unit: currentUnit, done: comp.done, total: comp.total, pct: comp.pct };
  }
  const day = days.find(d => !isDayDone(wk, d)) || days[days.length - 1];
  return { wk, day, topic: dayTopic(wk, day), done: comp.done, total: comp.total, pct: comp.pct };
}

function ringSVG(pct){ const r=40,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#efeae0" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="#2c6e6a" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2926">${pct}%</text></svg>`; }

function updateHomeMain(r) {
  if (nextDayEntry(currentWeekData()) && nextDayEntry(currentWeekData()).day) return;
  const items = (r && r.items) || [];
  const first = items[0];
  if (!first || !first.topic) return;
  const topic = first.topic.replace(/'/g,'');

  const title = document.getElementById('todayMainTitle');
  const why = document.getElementById('todayMainWhy');
  const btn = document.getElementById('todayMainBtn');

function cleanLearningReason(text) {
  return String(text || '')
    .replace(/前置已就绪的?/g, '适合现在学习的')
    .replace(/该往前推一步了/g, '可以开始学这一节')
    .replace(/适合现在学习的新知识点——可以开始学这一节。?/g, '这节已经适合现在学习，可以开始了。')
    .replace(/前线/g, '可学内容');
}

}

function routeListHtml() {
  const weeks = DATA.master.weeks || [];
  const cw = curWeek();
  if (!weeks.length) return `<div class="empty" style="padding:24px">还没有学习计划。</div>`;
  const months = DATA.master.months || [];
  const sections = months.length
    ? months.map(m => {
        const group = weeks.filter(wk => (m.weeks || []).includes(wk.week));
        if (!group.length) return '';
        return `<section class="month-section">
          <div class="month-head">
            <div><h2>${esc(m.title || m.id || '阶段')}</h2><p>${esc(m.deliverable || '')}</p></div>
            <span class="pill">${esc(m.date_range || '')}</span>
          </div>
          <div class="week-list">${group.map(wk => weekAccordionHtml(wk, cw)).join('')}</div>
        </section>`;
      }).join('')
    : `<section class="month-section"><div class="week-list">${weeks.map(wk => weekAccordionHtml(wk, cw)).join('')}</div></section>`;
  return `<div class="stage-plan">${sections}</div>`;
}

function weekAccordionHtml(wk, currentWeek) {
  const unlocked = isWeekUnlocked(wk.week);
  const done = unlocked && isWeekDone(wk);
  const state = !unlocked ? 'locked' : (wk.week === currentWeek ? 'current' : (done ? 'past' : 'unlocked'));
  const label = !unlocked ? '未解锁' : (wk.week === currentWeek ? '正在学' : (done ? '已完成' : '可学习'));
  const open = wk.week === currentWeek && unlocked;
  return `<section class="week-accordion ${state} ${open ? 'open' : ''}" id="week-${wk.week}">
    <button class="week-head" type="button" onclick="toggleWeek(${wk.week})">
      <span class="week-chip">W${wk.week}</span>
      <span>
        <span class="week-title">${esc(wk.title || '')}</span>
        <span class="week-meta">${esc(wk.date_range || '')}</span>
      </span>
      <span class="week-state" id="week-state-${wk.week}">${open ? '收起' : label}</span>
    </button>
    <div class="week-detail" id="week-detail-${wk.week}" style="${open ? '' : 'display:none'}">
      <div class="week-detail-inner">${weekDetailHtml(wk, wk.week === currentWeek)}</div>
    </div>
  </section>`;
}

function toggleWeek(week) {
  const detail = document.getElementById(`week-detail-${week}`);
  const state = document.getElementById(`week-state-${week}`);
  const wrap = document.getElementById(`week-${week}`);
  if (!detail) return;
  const closed = detail.style.display === 'none';
  detail.style.display = closed ? '' : 'none';
  if (wrap) wrap.classList.toggle('open', closed);
  const wk = weekByNumber(week) || { week };
  const unlocked = isWeekUnlocked(week);
  const label = !unlocked ? '未解锁' : (week === curWeek() ? '正在学' : (isWeekDone(wk) ? '已完成' : '可学习'));
  if (state) state.textContent = closed ? '收起' : label;
}

function detailedWeekPlan(week) {
  const plans = DATA.week_plans || {};
  const direct = plans[String(week)] || plans[week];
  if (direct && Number(direct.week) === Number(week)) return direct;
  const legacy = DATA.w1 || {};
  return Number(legacy.week) === Number(week) ? legacy : null;
}

function weekGoalsHtml(wk) {
  const goals = (wk.key_outcomes || []).filter(Boolean);
  if (!goals.length) return '';
  return `<div class="goal-list">${goals.map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
}

function weekDetailHtml(wk, isCurrent) {
  const unlocked = isWeekUnlocked(wk.week);
  const hasPlan = hasWeekPlan(wk.week);
  const days = weekDisplayDays(wk);
  if (!hasPlan) {
    return `<h3>本周目标</h3>${weekGoalsHtml(wk)}
      <div class="plan-hint">详细日计划尚未生成。完成 W${Math.max(1, Number(wk.week) - 1)} 全部日任务，并通过该周至少 4/6 关自检后，系统会自动生成 W${wk.week}。
      </div>`;
  }
  const hint = unlocked
    ? '<div class="plan-hint">只开放下一天的学习入口；后面的天暂未解锁，完成当前天后再继续。</div>'
    : '<div class="plan-hint">这一周尚未解锁。</div>';
  const completion = weekCompletion(wk);
  const check = selfCheckForWeek(wk.week);
  const gateAction = completion.completed
    ? `<div class="week-actions"><a class="btn ${selfCheckPassed(wk.week) ? 'ghost' : 'primary'} sm" href="${selfCheckUrl(wk.week)}">
        ${icon('check',14)} ${selfCheckPassed(wk.week) ? `查看 W${wk.week} 自检（已通过）` : (check ? `重做 W${wk.week} 自检（上次 ${check.passed_cnt}/6）` : `开始 W${wk.week} · 6 关自检`)}</a></div>`
    : '';
  const schedule = days.length
    ? `${hint}<h3 style="margin-top:13px">${hasPlan ? '每天怎么学' : '每日路径预览'}</h3>${weekScheduleHtml(days, false, { wk, interactive: true, current: isCurrent && unlocked, locked: !unlocked })}`
    : `<div class="plan-hint">这一周已解锁，但还没有详细到每天的安排。可以先从周主题开始学习。</div>
       ${isCurrent && unlocked ? `<div class="week-actions"><button class="btn primary sm" onclick="event.stopPropagation(); openLesson('${esc((wk.title || '').replace(/'/g, ''))}')">${icon('play',14)} 开始本周学习</button></div>` : ''}`;
  return `<h3>本周目标</h3>${weekGoalsHtml(wk)}${schedule}${gateAction}`;
}

function weekScheduleHtml(days, compact, opts = {}) {
  const today = new Date().toISOString().slice(0, 10);
  let list = days;
  if (compact) {
    const upcoming = days.filter(d => String(d.date || '') >= today);
    list = (upcoming.length ? upcoming : days).slice(0, 4);
  }
  return `<div class="schedule-list">${list.map(day => {
    const wk = opts.wk;
    const locked = !!opts.locked || !!day.preview;
    const next = opts.current && wk ? nextDayEntry(wk) : null;
    const isNext = !!(next && next.day && sameDay(next.day, day));
    const done = wk && !day.preview && isDayDone(wk, day);
    const unit = wk ? unitForDay(wk, day) : null;
    const preparing = isNext && preGenMatches(unit || (wk ? dayTopic(wk, day) : dayTitle(day))) && preGenBusy();
    const prepared = isNext && preGenMatches(unit || (wk ? dayTopic(wk, day) : dayTitle(day))) && pathPreGen().status === 'succeeded';
    const slots = (day.slots || []).map(s => {
      const time = s.time ? `<span class="time">${esc(s.time)}</span>` : '';
      return `<div class="slot-line">${time}${esc(s.task || '')}${s.output ? `<span class="output">产出：${esc(s.output)}</span>` : ''}</div>`;
    }).join('');
    const topic = (unit && unit.topic ? unit.topic : (wk ? dayTopic(wk, day) : dayTitle(day))).replace(/'/g, '');
    let action = '';
    if (opts.interactive) {
      if (locked) {
        action = `<span class="day-state locked">${icon('lock',12)} 未解锁</span>`;
      } else if (done) {
        action = `<button class="btn ghost sm" onclick="event.stopPropagation(); openLesson('${esc(topic)}')">${icon('refresh',14)} 复习</button>`;
      } else if (isNext) {
        if (preparing) {
          action = `<button class="btn ghost sm" onclick="event.stopPropagation(); openLesson('${esc(topic)}')">${icon('bolt',14)} 准备中</button>`;
        } else if (prepared) {
          action = `<button class="btn primary sm" onclick="event.stopPropagation(); openLesson('${esc(topic)}')">${icon('play',14)} 已准备好</button>`;
        } else {
          action = `<button class="btn primary sm" onclick="event.stopPropagation(); openLesson('${esc(topic)}')">${icon('play',14)} 学这一天</button>`;
        }
      } else {
        action = `<span class="day-state locked">${icon('lock',12)} 未解锁</span>`;
      }
    }
    const rowState = locked ? 'locked' : (done ? 'done' : (preparing ? 'preparing' : (isNext ? 'next' : 'locked')));
    return `<div class="day-row ${opts.interactive ? 'learnable' : ''} ${rowState} ${day.preview ? 'preview' : ''}">
      <div class="day"><span class="dno">D${esc(day.day || '')}</span>${esc(day.weekday || '')}<span class="date">${day.date ? `建议 ${esc((day.date || '').slice(5))}` : ''}</span></div>
      <div>${slots || '<span class="muted">暂无安排</span>'}</div>
      ${action}
    </div>`;
  }).join('')}</div>`;
}

function homeWeekPlanHtml(week) {
  const wk = currentWeekData();
  if (!wk) return `<div class="empty" style="padding:18px">还没有本周计划。</div>`;
  const plan = detailedWeekPlan(week);

    <h3 style="font-size:15px;margin:0">${esc(wk.title || '')}</h3>
    ${weekGoalsHtml(wk)}
    ${schedule}

}

      ? `<div class="go review">${icon('refresh',14)} 复习这一周</div>`

function cnode(c) {
  const diff = `难度 ${c.difficulty}/10`;
  const srcHtml = sourceHtml(c);
  if (c.status === 'frontier') {
    return `<div class="cnode frontier" onclick="openLesson('${esc(c.name).replace(/'/g,'')}')">
      <div class="cn-top"><span class="cn-name">${esc(c.name)}</span><span class="cn-diff">${diff}</span></div>
      <div class="cn-meta">第 ${c.week} 周 · 现在可以学 <span class="cn-go">${icon('play',13)} 学这一节</span></div>${srcHtml}</div>`;
  }
  if (c.status === 'mastered') {
    const pct = Math.round((c.mastery||0)*100);
    return `<div class="cnode mastered" onclick="openLesson('${esc(c.name).replace(/'/g,'')}')" title="点开复习">
      <div class="cn-top"><span class="cn-name">${icon('check',13)} ${esc(c.name)}</span><span class="cn-diff">${diff}</span></div>
      <div class="cn-meta">掌握度 <span class="cn-mbar"><span style="width:${pct}%"></span></span> ${pct}% · 自评 ${esc(c.self_label)}${c.due?' · <b style="color:var(--amber)">待复习</b>':''}</div>${srcHtml}</div>`;
  }
  const need = (c.prereq_names||[]).join('、') || '更基础的内容';
  return `<div class="cnode locked"><div class="cn-top"><span class="cn-name">${icon('lock',13)} ${esc(c.name)}</span><span class="cn-diff">${diff}</span></div>

function sourceHtml(c) {
  const srcs = c.sources || [];
  const links = srcs.slice(0,3).map(s => s.url
    ? `<a class="src" href="${esc(s.url)}" target="_blank" onclick="event.stopPropagation()">${icon('link',11)} ${esc(s.title)}</a>`
    : `<span class="src">${esc(s.title)}</span>`).join('');
  return `<div class="srcs" onclick="event.stopPropagation()">${links}<button class="src-edit" onclick="editSources('${esc(c.id)}')">${srcs.length?'编辑来源':'来源'}</button></div>`;
}

async function editSources(id) {
  const c = (GRAPH && GRAPH.concepts || []).find(x => x.id === id);
  if (!c) return;
  const current = (c.sources||[]).map(s => `${s.title}|${s.url||''}|${s.note||''}`).join('\n');
  const text = prompt('每行一个来源：标题|链接|说明。链接可留空，用于书刊/文献名。', current);
  if (text === null) return;
  const sources = text.split('\n').map(line => {
    const [title, url, note] = line.split('|');
    return { title:(title||'').trim(), url:(url||'').trim(), note:(note||'').trim(), kind:'other' };
  }).filter(s => s.title);
  const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/concept/${encodeURIComponent(id)}/sources`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sources})
  });
  if(!res.ok){ alert('保存来源失败：' + await res.text()); return; }
  GRAPH = null;
  await loadGraph(true);
  refreshCurrentPathTab();
}

async function editPlan() {
  const master = DATA.master || {};
  const ns = master.north_star || {};
  const target = prompt('学习目标', ns.target || '');
  if (target === null) return;
  const weeks = (master.weeks || []).map(w => ({...w}));
  const text = prompt('周计划：每行一周，格式为 周次|主题|关键产出1；关键产出2', weeks.map(w => `${w.week}|${w.title||''}|${(w.key_outcomes||[]).join('；')}`).join('\n'));
  if (text === null) return;
  const parsed = text.split('\n').map((line, i) => {
    const [week, title, outs] = line.split('|');
    return {
      week: Number(week || i + 1),
      title: (title || '').trim(),
      key_outcomes: (outs || '').split(/[；;]/).map(x => x.trim()).filter(Boolean),
      date_range: (weeks[i] && weeks[i].date_range) || '',
    };
  }).filter(w => w.title);
  const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/plan`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({target, weeks: parsed})
  });
  if(!res.ok){ alert('保存计划失败：' + await res.text()); return; }
  const d = await res.json();
  DATA.master = d.master;
  DATA.meta = d.meta;
  alert('计划已保存');
  refreshCurrentPathTab('weeks');
}

function refreshCurrentPathTab(forceTab) {
  const tab = forceTab || document.querySelector('[data-ptab].active')?.dataset.ptab || 'map';
  const body = document.getElementById('pathBody');
  document.querySelectorAll('[data-ptab]').forEach(t=>t.classList.toggle('active', t.dataset.ptab===tab));
  if (!body) return;
  if (tab === 'weeks') { body.innerHTML = renderWeeksHtml(); return; }
  if (tab === 'star') { body.innerHTML = renderStarMap(GRAPH); initStarMap(GRAPH); return; }
  body.innerHTML = renderGraph(GRAPH);
}

function phaseBand(phases) {
  if (!phases || !phases.length) return '';
  const ST = {
    cleared: { ic:'check',  tag:'已完成', cls:'ph-cleared' },
    current: { ic:'flag',   tag:'当前阶段', cls:'ph-current' },
    locked:  { ic:'lock',   tag:'后面再学', cls:'ph-locked' },
  };
  const cards = phases.map(p => {
    const s = ST[p.status] || ST.locked;
    const gpct = Math.round((p.gate_ratio||0.7)*100);
    const pct = Math.round((p.ratio||0)*100);
    const wk = (p.weeks&&p.weeks.length) ? `W${p.weeks[0]}–${p.weeks[p.weeks.length-1]}` : '';
    const gate = p.status==='cleared'
      ? `已达标`
      : (p.total ? `已掌握 ${p.mastered}/${p.total} · 达到约 ${gpct}% 后进入下一阶段` : '暂无知识点');
    return `<div class="phase ${s.cls}">
      <div class="ph-top"><span class="ph-tag">${icon(s.ic,12)} ${s.tag}</span><span class="ph-wk">${wk}</span></div>
      <div class="ph-title">${esc(p.title||p.id||'')}</div>
      ${p.deliverable?`<div class="ph-deliver">🎯 ${esc(p.deliverable)}</div>`:''}
      <div class="ph-bar"><span style="width:${pct}%"></span></div>
      <div class="ph-gate">${gate}</div></div>`;
  }).join('');
  return `<div class="sec-title"><span class="bar"></span>${icon('flag',15)} 阶段目标</div>
    <div class="section-help">每个阶段都有一个明确目标。当前阶段学到一定程度后，后面的阶段会开放。</div>
    <div class="phase-grid">${cards}</div>`;
}

function renderGraph(g) {
  if (!g || !(g.concepts||[]).length) {
    return `<div class="empty">知识图谱暂时不可用。<br><button class="minibtn" style="margin-top:12px" onclick="regenGraph()">重新生成</button></div>`;
  }
  const cs = g.concepts.slice();
  const sortFn = (a,b)=> (a.week-b.week) || (a.difficulty-b.difficulty);
  const frontier = cs.filter(c=>c.status==='frontier').sort(sortFn);
  const mastered = cs.filter(c=>c.status==='mastered').sort(sortFn);
  const locked = cs.filter(c=>c.status==='locked').sort(sortFn);
  const total = (g.counts&&g.counts.total) || cs.length;
  const pct = total ? Math.round((mastered.length/total)*100) : 0;
  let html = `<div class="sec-title"><span class="bar"></span>${icon('play',15)} 现在可以学</div>
    <div class="section-help">这些知识点前面的基础已经够了，直接点“学这一节”开始。</div>`;
  html += frontier.length ? frontier.map(cnode).join('') : `<div class="empty" style="padding:18px">现在没有新的可学知识点。可以先复习已学内容，或继续完成当前阶段目标。</div>`;
  html += `
    <div class="terr">
      <div class="tcard acc-done"><div class="n">${mastered.length}</div><div class="l">已掌握</div></div>
      <div class="tcard acc-front"><div class="n">${frontier.length}</div><div class="l">现在可学</div></div>
      <div class="tcard"><div class="n">${locked.length}</div><div class="l">后面再学</div></div>
    </div>
    <div class="terrbar"><span style="width:${pct}%"></span></div>
    <div style="font-size:12.5px;color:var(--ink-faint);margin-bottom:6px">学习路线进度 ${pct}%（共 ${total} 个知识点）</div>`;
  html += phaseBand(g.phases);
  if (mastered.length) {
    html += `<div class="sec-title"><span class="bar"></span>${icon('trophy',15)} 已掌握（${mastered.length}）</div>` + mastered.map(cnode).join('');
  }
  if (locked.length) {
    html += `<div class="sec-title"><span class="bar"></span>${icon('lock',15)} 后面再学（${locked.length}）</div>
      <div class="section-help">这些内容暂时不用管。学完前置知识后，它们会自动进入“现在可以学”。</div>` + locked.map(cnode).join('');
  }
  return html;
}

let STAR = null;
function renderStarMap(g) {
  const cs = (g && g.concepts) || [];
  if (!cs.length) return `<div class="empty">知识图谱暂时不可用。<br><button class="minibtn" style="margin-top:12px" onclick="regenGraph()">重新生成</button></div>`;
  const COLW=210, ROWH=86, R=20, PADX=80, PADY=64;
  const weeks = [...new Set(cs.map(c=>c.week||1))].sort((a,b)=>a-b);
  const wIdx = {}; weeks.forEach((w,i)=>wIdx[w]=i);
  const byWeek = {}; weeks.forEach(w=>byWeek[w]=[]);
  cs.forEach(c=>byWeek[c.week||1].push(c));
  weeks.forEach(w=>byWeek[w].sort((a,b)=>(a.difficulty||5)-(b.difficulty||5)));
  const maxRows = Math.max(1, ...weeks.map(w=>byWeek[w].length));
  const height = PADY*2 + maxRows*ROWH;
  const width = PADX*2 + Math.max(1,(weeks.length-1))*COLW;
  const pos = {};
  weeks.forEach(w=>{
    const col = byWeek[w], n = col.length, yStart = (height - n*ROWH)/2 + ROWH/2;
    col.forEach((c,j)=>{ pos[c.id] = { x: PADX + wIdx[w]*COLW, y: yStart + j*ROWH }; });
  });
  const byId = {}; cs.forEach(c=>byId[c.id]=c);
  const edges = [];
  cs.forEach(c=>(c.prerequisites||[]).forEach(p=>{ if(pos[p]&&pos[c.id]) edges.push({from:p,to:c.id}); }));
  const adj = {}; cs.forEach(c=>adj[c.id]=new Set([c.id]));
  edges.forEach(e=>{ adj[e.from].add(e.to); adj[e.to].add(e.from); });
  const edgeSvg = edges.map(e=>{
    const a=pos[e.from], b=pos[e.to], dx=Math.max(40,(b.x-a.x)/2);
    return `<path class="star-edge" data-from="${e.from}" data-to="${e.to}" d="M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}" marker-end="url(#star-arrow)"></path>`;
  }).join('');
  const colSvg = weeks.map(w=>`<text class="star-cols" x="${PADX+wIdx[w]*COLW}" y="26">W${w}</text>`).join('');
  const C = 2*Math.PI*R;
  const nodeSvg = cs.map(c=>{
    const p=pos[c.id], frac=Math.max(0,Math.min(1,c.mastery||0));
    const nm = (c.name||'').length>9 ? (c.name.slice(0,8)+'…') : (c.name||'');
    return `<g class="snode s-${c.status}" data-id="${c.id}" transform="translate(${p.x},${p.y})">
      <circle class="ring-bg" r="${R}"></circle>
      <circle class="ring" r="${R}" stroke-dasharray="${(frac*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90)"></circle>
      <circle class="core" r="${R-6}"></circle>
      <text class="lbl" y="${R+15}">${esc(nm)}</text></g>`;
  }).join('');
  STAR = { pos, byId, adj, edges, width, height, vb:{x:0,y:0,w:width,h:height} };
  return `<div class="starwrap" id="starwrap">
    <svg id="starsvg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="知识星图：按周分列、按难度分行的概念依赖图">
      <defs><marker id="star-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--line)"></path></marker></defs>
      <g>${colSvg}${edgeSvg}${nodeSvg}</g>
    </svg>
    <div class="star-ctrl"><button onclick="starZoom(.8)" aria-label="放大">+</button><button onclick="starZoom(1.25)" aria-label="缩小">−</button><button onclick="starReset()" title="复位" aria-label="复位视图" style="font-size:13px">⤢</button></div>
    <div class="star-legend"><span><i style="background:#1f8a70"></i>已掌握</span><span><i style="background:var(--teal)"></i>现在可学</span><span><i style="background:#cfcabf"></i>后面再学</span><span style="color:var(--ink-faint)">滚轮/双指缩放 · 拖拽平移 · 悬停看依赖</span></div>
    <div class="star-tip" id="startip"></div></div>`;
}
function _svgPoint(svg,cx,cy){ const r=svg.getBoundingClientRect(),vb=STAR.vb; return { x: vb.x+(cx-r.left)/r.width*vb.w, y: vb.y+(cy-r.top)/r.height*vb.h }; }
function _applyVB(){ const s=document.getElementById('starsvg'); if(s&&STAR) s.setAttribute('viewBox', `${STAR.vb.x} ${STAR.vb.y} ${STAR.vb.w} ${STAR.vb.h}`); }
function starZoom(f, cx, cy){ if(!STAR) return; const vb=STAR.vb; const nw=Math.max(140, Math.min(STAR.width*2.5, vb.w*f)), nh=nw*(vb.h/vb.w);
  if(cx==null){ cx=vb.x+vb.w/2; cy=vb.y+vb.h/2; }
  vb.x=cx-(cx-vb.x)*(nw/vb.w); vb.y=cy-(cy-vb.y)*(nh/vb.h); vb.w=nw; vb.h=nh; _applyVB(); }
function starReset(){ if(!STAR) return; STAR.vb={x:0,y:0,w:STAR.width,h:STAR.height}; _applyVB(); }
function initStarMap(g){
  const wrap=document.getElementById('starwrap'), svg=document.getElementById('starsvg'), tip=document.getElementById('startip');
  if(!wrap||!svg||!STAR) return;
  svg.addEventListener('wheel',(e)=>{ e.preventDefault(); const pt=_svgPoint(svg,e.clientX,e.clientY); starZoom(e.deltaY<0?0.85:1.18, pt.x, pt.y); }, {passive:false});
  let drag=null;
  svg.addEventListener('pointerdown',(e)=>{ drag={x:e.clientX,y:e.clientY}; svg.classList.add('grabbing'); try{svg.setPointerCapture(e.pointerId);}catch(_){} });
  svg.addEventListener('pointermove',(e)=>{ if(!drag) return; const r=svg.getBoundingClientRect(); STAR.vb.x-=(e.clientX-drag.x)*(STAR.vb.w/r.width); STAR.vb.y-=(e.clientY-drag.y)*(STAR.vb.h/r.height); drag={x:e.clientX,y:e.clientY}; _applyVB(); });
  const end=()=>{ drag=null; svg.classList.remove('grabbing'); };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  wrap.querySelectorAll('.snode').forEach(node=>{
    const id=node.dataset.id;
    node.addEventListener('mouseenter',()=>{
      wrap.classList.add('dim'); const nb=STAR.adj[id];
      wrap.querySelectorAll('.snode').forEach(n=>n.classList.toggle('hi', nb.has(n.dataset.id)));
      wrap.querySelectorAll('.star-edge').forEach(ed=>{ const on=(ed.dataset.from===id||ed.dataset.to===id); ed.classList.toggle('hi',on); ed.classList.toggle('up', ed.dataset.to===id&&on); ed.classList.toggle('down', ed.dataset.from===id&&on); });
      const c=STAR.byId[id], st={mastered:'已掌握',frontier:'现在可学',locked:'后面再学'}[c.status]||'';
      const pre=(c.prereq_names||[]).length?`<br>需先：${c.prereq_names.map(esc).join('、')}`:'';
      tip.innerHTML=`<b>${esc(c.name)}</b><br>${st} · 难度 ${c.difficulty}/10 · 掌握 ${Math.round((c.mastery||0)*100)}%${pre}`;
    });
    node.addEventListener('mousemove',(e)=>{ const r=wrap.getBoundingClientRect(); let x=e.clientX-r.left+14, y=e.clientY-r.top+14; if(x>r.width-230)x-=244; tip.style.left=x+'px'; tip.style.top=y+'px'; tip.classList.add('show'); });
    node.addEventListener('mouseleave',()=>{ wrap.classList.remove('dim'); wrap.querySelectorAll('.hi').forEach(n=>n.classList.remove('hi','up','down')); tip.classList.remove('show'); });
    node.addEventListener('click',()=>{ const c=STAR.byId[id]; if(c.status==='locked'){ tip.innerHTML=`🔒 先掌握：${esc((c.prereq_names||[]).join('、')||'前置知识点')}`; tip.classList.add('show'); setTimeout(()=>tip.classList.remove('show'),1800); return; } openLesson((c.name||'').replace(/'/g,'')); });
  });
}

async function initPath() {
  const tabs = document.querySelectorAll('[data-ptab]');
  const body = document.getElementById('pathBody');
  if (!tabs.length || !body) return;
  async function show(tab) {
    tabs.forEach(t=>t.classList.toggle('active', t.dataset.ptab===tab));
    if (tab === 'weeks') { body.innerHTML = renderWeeksHtml(); return; }
    body.innerHTML = `<div class="center" style="padding:40px"><div class="spin"></div><p style="margin-top:12px;font-size:13px;color:var(--ink-faint)">首次会让教研 Agent 拆解知识依赖，约几秒…</p></div>`;
    const g = await loadGraph();
    if (tab === 'star') { body.innerHTML = renderStarMap(g); initStarMap(g); return; }
    body.innerHTML = renderGraph(g);
  }
  tabs.forEach(t=>t.addEventListener('click', ()=>show(t.dataset.ptab)));
  show('map');
}

async function regenGraph() {
  const body = document.getElementById('pathBody');
  if (body) body.innerHTML = `<div class="center" style="padding:40px"><div class="spin"></div><p style="margin-top:12px;font-size:13px;color:var(--ink-faint)">重新拆解知识依赖…</p></div>`;
  try { const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/graph?regenerate=1`); GRAPH = res.ok ? await res.json() : null; } catch(e){ GRAPH = null; }
  if (body) body.innerHTML = renderGraph(GRAPH);
}

function viewAnalytics() {
  return `
    <div class="ph"><h1>学情分析</h1><p>基于学前诊断和学习记录，判断你现在卡在哪里、下一步怎么调。</p></div>
    <div id="analyticsBody"><div class="center" style="padding:40px"><div class="spin"></div></div></div>`;
}

function avgPct(items, key) {
  const vals = (items || []).map(x => x[key]).filter(x => x != null && !Number.isNaN(Number(x)));
  if (!vals.length) return null;
  return Math.round(vals.reduce((s,v)=>s+Number(v),0) / vals.length);
}

function abilityScore(value) {
  if (value == null) return 1;
  return Math.max(0, Math.min(5, Math.round(Number(value) / 20)));
}

function abilityRows(a) {
  const ns = DATA.master.north_star || {};
  const bp = (a && a.baseline_profile) || ns.baseline_profile || null;
  if (bp) {
    if (bp.assessment_method === 'observed_v2' && Array.isArray(bp.abilities) && bp.abilities.length) {
      return bp.abilities.map(item => ({
        name: item.label,
        score: Math.round(Number(item.score || 0) / 2) / 10,
        note: `客观表现 ${Math.round(Number(item.score || 0))}/100 · 置信度 ${Math.round(Number(item.confidence || 0) * 100)}% · ${Number((item.evidence_ids || []).length)} 条证据`,
      }));
    }
    const byDimension = Object.fromEntries((bp.dimensions || []).map(d => [d.dimension, d]));
    const validation = byDimension['验收纠错'];
    const transfer = byDimension['迁移落地'];
    return [
      { name: '目标清晰', score: 4, note: '已建立可追溯的学前基线' },
      { name: '独立底座', score: Number(bp.independent_score || 0), note: '历史自评坐标，未经过客观判分' },
      { name: 'AI 协作', score: Number(bp.with_ai_score || 0), note: `历史自评协作增益 ${Number(bp.gap || 0).toFixed(1)}` },
      { name: '验收纠错', score: validation ? Number(validation.independent_score || 0) : Number(bp.independent_score || 0), note: '能否核对、解释并修正 AI 产物' },
      { name: '迁移落地', score: transfer ? Number(transfer.independent_score || 0) : Number(bp.independent_score || 0), note: '能否迁移到真实任务' },
    ];
  }
  const topics = (a && a.topics) || [];
  const obj = avgPct(topics, 'objective_pct');
  const self = avgPct(topics, 'self_score');
  const review = a && a.review_queue ? a.review_queue.length : 0;
  const hasBaseline = !!(ns.baseline_summary || '').trim();
  return [
    { name: '目标清晰', score: hasBaseline ? 4 : 2, note: hasBaseline ? '学前诊断已形成起点画像' : '还缺少清晰的学前诊断' },
    { name: '基础掌握', score: a && a.topics_studied ? abilityScore(a.objective_pct) : 1, note: a && a.topics_studied ? '来自练习答对率' : '还没有学练数据' },
    { name: '独立输出', score: abilityScore(obj), note: obj == null ? '完成练习后开始校准' : '离开提示后的客观表现' },
    { name: 'AI 协作', score: self == null ? 2 : abilityScore(self), note: self == null ? '先按学前画像估计' : '来自每节自评' },
    { name: '复习稳定', score: a && a.topics_studied ? Math.max(1, 4 - Math.min(3, review)) : 1, note: review ? `${review} 个内容需要复习` : '暂时没有复习压力' },
  ];
}

function scoreWidth(score) {
  return Math.max(6, Math.min(100, (score / 5) * 100));
}

function radarPoint(score, index, total, radius) {
  const angle = -Math.PI / 2 + index * Math.PI * 2 / total;
  const r = radius * Math.max(0, Math.min(5, score)) / 5;
  return { x: 150 + Math.cos(angle) * r, y: 150 + Math.sin(angle) * r };
}

function radarPoints(scores, radius = 102) {
  return scores.map((score, i) => {
    const p = radarPoint(score, i, scores.length, radius);
    return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
  }).join(' ');
}

function radarSvg(rows, a) {
  const current = rows.map(r => r.score);
  const baseline = rows.map((r, i) => {
    if (a && a.topics_studied) return Math.max(1, r.score - 1);
    return i === 0 ? Math.min(3, r.score) : 1;
  });
  const target = rows.map(r => Math.max(4, Math.min(5, r.score + 1)));
  const grid = [1,2,3,4,5].map(s => `<polygon points="${radarPoints(rows.map(()=>s), 102)}" fill="none" stroke="var(--line)" stroke-width="${s === 5 ? 1.2 : .8}"></polygon>`).join('');
  const axes = rows.map((r, i) => {
    const p = radarPoint(5, i, rows.length, 102);
    const lp = radarPoint(5.7, i, rows.length, 102);
    const anchor = lp.x > 158 ? 'start' : (lp.x < 142 ? 'end' : 'middle');
    return `<line x1="150" y1="150" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="var(--line)" stroke-width=".8"></line>
      <text x="${lp.x.toFixed(1)}" y="${lp.y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="11" fill="var(--ink-soft)">${esc(r.name)}</text>`;
  }).join('');
  const dots = current.map((score, i) => {
    const p = radarPoint(score, i, rows.length, 102);
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" fill="var(--teal)"></circle>`;
  }).join('');
  return `<div>
    <svg class="radar-svg" viewBox="0 0 300 300" role="img" aria-label="课程能力雷达图">
      ${grid}${axes}
      <polygon points="${radarPoints(target)}" fill="none" stroke="var(--green)" stroke-width="2" stroke-dasharray="5 5"></polygon>
      <polygon points="${radarPoints(baseline)}" fill="rgba(183,173,159,.08)" stroke="#b7ad9f" stroke-width="1.8" stroke-dasharray="3 4"></polygon>
      <polygon points="${radarPoints(current)}" fill="rgba(44,110,106,.18)" stroke="var(--teal)" stroke-width="2.4"></polygon>
      ${dots}
    </svg>
    <div class="radar-legend"><span class="cur"><i></i>当前</span><span class="base"><i></i>学前</span><span class="target"><i></i>目标</span></div>
  </div>`;
}

function axisListHtml(rows) {
  return `<div class="axis-list">${rows.map(r => `<div class="axis-item">
    <div class="top"><span>${esc(r.name)}</span><span>${r.score}/5</span></div>
    <div class="note">${esc(r.note)}</div>
  </div>`).join('')}</div>`;
}

function courseMetricHtml(a) {
  const wk = currentWeekData();
  const entry = nextDayEntry(wk);
  const learned = a && a.topics_studied ? a.topics_studied : 0;
  const lessons = a && a.lessons_done ? a.lessons_done : 0;

    <div class="metric-tile"><div class="k">已完成学练</div><div class="v">${lessons}</div></div>
    <div class="metric-tile"><div class="k">独立答对率</div><div class="v">${objective}</div></div>

function learningProgressItems(a) {
  const topics = ((a && a.topics) || []).slice().sort((x, y) => String(x.last_studied || '').localeCompare(String(y.last_studied || '')));
  return topics.map((t, i) => {
    const vals = [];
    if (t.objective_pct != null) vals.push(Number(t.objective_pct));
    if (t.self_score != null) vals.push(Number(t.self_score));
    const score = vals.length ? Math.round(vals.reduce((s,v)=>s+v,0) / vals.length) : (t.times_studied ? 35 : 10);
    return {
      step: i + 1,
      topic: t.topic || `第 ${i + 1} 次学习`,
      date: String(t.last_studied || '').slice(5, 16).replace('T', ' '),
      score,
      objective: t.objective_pct,
      self: t.self_label || '—',
    };
  });
}

function progressTrendSvg(items) {
  if (!items.length) return `<div class="trend-empty">还没有学习记录。完成第一天后，这里会出现能力曲线。</div>`;
  const w = 640, h = 170, padX = 34, top = 18, bottom = 138;
  const span = Math.max(1, items.length - 1);
  const pts = items.map((it, i) => ({
    x: items.length === 1 ? w / 2 : padX + i * ((w - padX * 2) / span),
    y: bottom - Math.max(0, Math.min(100, it.score)) / 100 * (bottom - top),
    it,
  }));
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `${path} L${pts[pts.length - 1].x.toFixed(1)},${bottom} L${pts[0].x.toFixed(1)},${bottom} Z`;
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--teal)"><title>${esc(p.it.topic)} · ${p.it.score}</title></circle>`).join('');
  const labels = pts.filter((_, i) => i === 0 || i === pts.length - 1 || items.length <= 4).map(p => `<text x="${p.x.toFixed(1)}" y="154" text-anchor="middle" font-size="11" fill="var(--ink-faint)">第${p.it.step}次</text>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="学习进步曲线">
    <line x1="${padX}" y1="${bottom}" x2="${w-padX}" y2="${bottom}" stroke="var(--line)"></line>
    <line x1="${padX}" y1="${top}" x2="${w-padX}" y2="${top}" stroke="var(--line)" stroke-dasharray="4 5"></line>
    <path d="${area}" fill="rgba(44,110,106,.12)"></path>
    <path d="${path}" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
    ${dots}${labels}
  </svg>`;
}

function progressListHtml(items) {
  if (!items.length) return '';
  return `<div class="progress-list">${items.slice(-4).reverse().map(it => `<div class="progress-item">
    <div class="step">第${it.step}次</div>
    <div><div class="topic">${esc(it.topic)}</div><div class="meta">${esc(it.date || '刚刚')} · 自评 ${esc(it.self)}</div></div>
    <div class="score">${it.score}</div>
  </div>`).join('')}</div>`;
}

function diagnosisSummary(a) {
  const ns = DATA.master.north_star || {};
  const baseline = ns.baseline_summary || '学前诊断还不完整，需要先完成几节学练来校准。';
  if (!a || a.topics_studied === 0) {
    return {
      title: '已完成学前诊断，但还缺少真实学习证据。',
      sub: `${baseline} 先学一节，系统就能开始校准当前画像。`,
    };
  }
  const review = a.review_queue || [];
  const weak = a.weak_points || [];
  if (review.length) return {
    title: `主要问题不是继续往前赶，而是先复习 ${review.length} 个到期内容。`,
    sub: '先把旧内容留住，再推进新内容，学习曲线会更稳。',
  };
  if (weak.length) return {
    title: `当前短板集中在「${weak[0].topic}」。`,
    sub: '建议先补弱项，再进入更后面的内容。',
  };
  return {
    title: `当前学习计划可以继续推进，已完成 ${a.topics_studied} 个知识点。`,
    sub: '继续按学习首页推进；系统会根据练习、错题和自评更新画像。',
  };
}

function decisionItems(a) {
  const review = a && a.review_queue ? a.review_queue : [];
  const weak = a && a.weak_points ? a.weak_points : [];
  if (review.length) {
    return [
      ['先复习', `先处理「${review[0].topic}」等到期内容。`],
      ['再推进', '复习完成后再回到学习首页继续下一节。'],
      ['观察', '如果连续答错，系统会把对应知识点标为弱项。'],
    ];
  }
  if (weak.length) {
    return [
      ['先补短板', `优先重学「${weak[0].topic}」。`],
      ['降低步长', '下一节讲解应更短，练习更具体。'],
      ['再评估', '完成后看独立答对率是否回升。'],
    ];
  }
  return [
    ['先学一节', '从学习首页的“开始这一节”进入。'],
    ['做完自评', '学完后选择是否能独立用，校准能力画像。'],
    ['自动调整', '系统会根据错题、产出和自评更新后续安排。'],
  ];
}

function replanSection() {
  if (!REPLAN) return '';
  const proposal = REPLAN.proposal;
  const triggers = REPLAN.triggers || [];
  if (!proposal && !triggers.length) {
    return `<div class="sec-title"><span class="bar"></span>${icon('compass',15)} 路径调整</div>
      <div class="analysis-panel"><div style="font-size:13.5px;color:var(--ink-soft)">当前没有足够证据需要改路径。系统会继续观察卡壳、超额达标和中断。</div></div>`;
  }
  if (!proposal) {
    const trigger = triggers[0];
    return `<div class="sec-title"><span class="bar"></span>${icon('compass',15)} 路径调整建议</div>
      <div class="analysis-panel"><h2>${esc(trigger.title || '发现可调整信号')}</h2>
        <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin-top:8px">${esc(trigger.message || '')}</p>
        <div class="actions"><button class="btn primary sm" onclick="createReplanProposal()">生成可确认调整提案</button></div>
      </div>`;
  }
  const p = proposal.proposal || {};
  const changes = (p.changes || []).map(item => `<div class="decision-item"><div class="t">${esc(item.field || '调整')}</div><div class="d">${esc(item.description || '')}</div></div>`).join('');
  let actions = '';
  if (proposal.status === 'proposed') {
    actions = `<button class="btn primary sm" onclick="decideReplan('${proposal.id}','confirm')">确认应用</button>
      <button class="btn ghost sm" onclick="decideReplan('${proposal.id}','reject')">暂不调整</button>`;
  } else if (proposal.status === 'applied') {
    actions = `<button class="btn ghost sm" onclick="decideReplan('${proposal.id}','undo')">撤销本次调整</button>`;
  }
  const statusLabel = {proposed:'待你确认',applied:'已应用',rejected:'已拒绝',undone:'已撤销'}[proposal.status] || proposal.status;
  return `<div class="sec-title"><span class="bar"></span>${icon('compass',15)} 路径调整提案</div>
    <div class="analysis-panel"><h2>${esc(p.title || '学习路径调整')} · ${esc(statusLabel)}</h2>
      <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.7;margin-top:8px">${esc(p.summary || '')}</p>
      <div class="decision-list" style="margin-top:12px">${changes}</div>
      <div class="actions">${actions}</div>
    </div>`;
}

async function loadReplan() {
  try {
    const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/replan`, {cache:'no-store'});
    REPLAN = res.ok ? await res.json() : null;
  } catch(e) { REPLAN = null; }
  return REPLAN;
}

async function createReplanProposal() {
  const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/replan/proposals`, {method:'POST'});
  if (!res.ok) { alert('生成提案失败：' + await res.text()); return; }
  await loadReplan();
  renderAnalyticsTab('path');
}

async function decideReplan(proposalId, action) {
  const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/replan/proposals/${encodeURIComponent(proposalId)}/decision`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action})
  });
  if (!res.ok) { alert('处理提案失败：' + await res.text()); return; }
  if (action === 'confirm' || action === 'undo') {
    const fresh = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}`);
    if (fresh.ok) DATA = await fresh.json();
  }
  await loadReplan();
  renderAnalyticsTab('path');
}

    <div class="decision-item"><div class="t">独立表现</div><div class="d">${bp.assessment_method === 'observed_v2' ? Math.round(Number(bp.observed_independent_score || 0)) + ' / 100' : Number(bp.independent_score || 0).toFixed(1) + ' / 5'}</div></div>
    <div class="decision-item"><div class="t">AI 协作表现</div><div class="d">${bp.assessment_method === 'observed_v2' ? Math.round(Number(bp.observed_with_ai_score || 0)) + ' / 100' : Number(bp.with_ai_score || 0).toFixed(1) + ' / 5'}</div></div>
    <div class="decision-item"><div class="t">画像置信度</div><div class="d">${bp.assessment_method === 'observed_v2' ? Math.round(Number(bp.profile_confidence || 0) * 100) + '% · ' + Number((bp.score_evidence || []).length) + ' 条证据' : '不适用'}</div></div>
  </div>` : '';
  const baselineDecisions = (ns.baseline_decisions || []).map(item => `<div class="decision-item"><div class="t">${esc(item.action || '')}</div><div class="d">依据 ${esc((item.evidence_ids || []).join('、') || '画像规则')}</div></div>`).join('');
  const learned = a && a.topics_studied ? a.topics_studied : 0;
  const objective = learned && a && a.objective_pct != null ? `${a.objective_pct}%` : '暂无';
  const due = a && a.review_queue ? a.review_queue.length : 0;
  const progress = learningProgressItems(a);
  return `
    <div class="insight">
      <div class="label">${icon('compass',14)} 诊断结论</div>
      <div class="text">${esc(d.title)}</div>
      <div class="sub">${esc(d.sub)}</div>
    </div>
    <div class="analysis-grid course-visual-grid">
      <div class="analysis-panel radar-panel">
        <h2>${icon('target',16)} ${esc(ns.domain || '这门课')} · 能力画像</h2>
        <div class="radar-wrap">
          ${radarSvg(ability, a)}
          ${axisListHtml(ability)}
        </div>
      </div>
      <div class="analysis-panel">
        <h2>${icon('flag',16)} 下一步决策</h2>
        ${courseMetricHtml(a)}
        <div class="decision-list">${decisions}</div>
      </div>
    </div>
    <div class="analysis-grid">
      <div class="analysis-panel progress-panel">
        <h2>${icon('bolt',16)} 每次学习的进步</h2>
        <div class="trend-chart">${progressTrendSvg(progress)}</div>
        ${progressListHtml(progress)}
      </div>
      <div class="analysis-panel">
        <h2>${icon('target',16)} 维度解释</h2>
        ${rows}
      </div>
    </div>
    <div class="analysis-grid">
      <div class="analysis-panel">
        <h2>${icon('users',16)} 学前诊断档案</h2>
        <div style="font-size:13.5px;line-height:1.7;color:var(--ink-soft)">${esc(baseline)}</div>
        ${baselineCoordinates}
        ${baselineDecisions ? `<div class="sec-title" style="margin-top:16px"><span class="bar"></span>画像如何改变路径</div><div class="decision-list">${baselineDecisions}</div>` : ''}
        <div class="diagnosis-tags">${diagnosisTags}</div>
      </div>
      <div class="analysis-panel">
        <h2>${icon('info',16)} 当前证据</h2>
        <div class="decision-list">
          <div class="decision-item"><div class="t">已学知识点</div><div class="d">${learned}</div></div>
          <div class="decision-item"><div class="t">客观答对率</div><div class="d">${objective}</div></div>
          <div class="decision-item"><div class="t">待复习</div><div class="d">${due}</div></div>
        </div>

    </div>
    ${replanSection()}

function renderAnalyticsTab(tab) {
  const body = document.getElementById('analyticsBody');
