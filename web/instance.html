}

/* ---------- LearnBuddy 复盘（元认知 · 可追问） ---------- */
let COACH_HISTORY = [];
let COACH_BUSY = false;

function coachSection() {
  const head = `<div class="ch">${icon('compass',18)} 本周 LearnBuddy 复盘</div>`;
  if (!COACH_HISTORY.length) {
    return `<div class="coachcard" id="coachCard">${head}
      <div style="font-size:13.5px;color:var(--ink-soft);margin-top:8px;line-height:1.6">基于你的学情做一次元认知复盘——不只是数据，而是"问题出在哪、下一步该怎么调"。还能追问。</div>
      <button class="btn primary" id="coachGen" style="margin-top:12px" onclick="genCoach()">${icon('compass',15)} 生成本周复盘</button></div>`;
  }
  return `<div class="coachcard" id="coachCard">${head}<div id="coachThread">${coachThreadHtml()}</div></div>`;
}

function coachThreadHtml() {
  const msgs = COACH_HISTORY.map(m =>
    m.role === 'user'
      ? `<div class="coachmsg user">${esc(m.content)}</div>`
      : `<div class="coachmsg coach">${md(m.content)}</div>`
  ).join('');
  const busy = COACH_BUSY ? `<div class="coachmsg coach"><span class="spin" style="width:18px;height:18px;display:inline-block;vertical-align:-3px"></span> LearnBuddy 思考中…</div>` : '';
  const ask = COACH_BUSY ? '' :
    `<div class="coachask"><input id="coachInput" placeholder="追问 LearnBuddy，例如：为什么我总在这卡住？" onkeydown="if(event.key==='Enter')askCoach()"><button class="btn primary" onclick="askCoach()">${icon('send',15)}</button></div>`;
  return msgs + busy + ask;
}

function paintCoach() {
  const t = document.getElementById('coachThread');
  const card = document.getElementById('coachCard');
  if (t) { t.innerHTML = coachThreadHtml(); }
  else if (card) { card.innerHTML = `<div class="ch">${icon('compass',18)} 本周 LearnBuddy 复盘</div><div id="coachThread">${coachThreadHtml()}</div>`; }
  const inp = document.getElementById('coachInput'); if (inp) inp.focus();
}

async function callCoach() {
  COACH_BUSY = true; paintCoach();
  try {
    const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/coach`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ history: COACH_HISTORY })
    });
    if (res.status === 401) { location.href = '/login'; return; }
    const d = await res.json().catch(()=>({}));
    COACH_HISTORY.push({ role:'assistant', content: res.ok ? (d.reply || '（无内容）') : (d.detail || '复盘失败，请稍后再试。') });
  } catch (e) {
    COACH_HISTORY.push({ role:'assistant', content: '网络异常，复盘失败。' });
  } finally {
    COACH_BUSY = false; paintCoach();
  }
}

function genCoach() { if (!COACH_BUSY) callCoach(); }

function askCoach() {
  if (COACH_BUSY) return;
  const inp = document.getElementById('coachInput');
  const q = inp ? inp.value.trim() : '';
  if (!q) return;
  COACH_HISTORY.push({ role:'user', content: q });
  callCoach();
}

async function initAnalytics() {
  ANALYTICS = await loadAnalytics(true);
  await loadReplan();
  document.querySelectorAll('[data-ltab]').forEach(b=>b.addEventListener('click',()=>renderAnalyticsTab(b.dataset.ltab)));
  renderAnalyticsTab('path');
}

const MEM_LABEL = { struggle:'易错', strength:'已扎实', preference:'偏好', goal:'目标', pace:'节奏', fact:'其他' };
function memSection() {
  return `<div class="memcard" id="memCard">
    <div class="ch">${icon('users',16)} 关于你 · 系统记忆<span class="memhint">越学越懂你，会喂给教练和讲解</span></div>
    <div id="memBody"><div class="muted" style="font-size:13px;padding:6px 0">加载中…</div></div>
    <div class="memadd"><input id="memInput" placeholder="加一条偏好，如「讲解多给例句、少用术语」" maxlength="80" onkeydown="if(event.key==='Enter')addMemory()"><button class="minibtn" onclick="addMemory()">记住</button></div></div>`;
}
async function loadMemory() {
  const body = document.getElementById('memBody');
  if (!body) return;
  let d;
  try { const r = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/memory`); if(!r.ok) return; d = await r.json(); }

  const mems = d.memories || [];
  if (!mems.length) { body.innerHTML = '<div class="muted" style="font-size:13px;padding:6px 0">还没有记忆。多学几节，系统会自动总结你的弱项 / 强项 / 节奏；也可以手动加一条偏好。</div>'; return; }
  body.innerHTML = mems.map(m=>`<div class="memitem mk-${esc(m.kind)}"><span class="memk">${MEM_LABEL[m.kind]||'其他'}</span><span class="memc">${esc(m.content)}</span>${m.source==='user'?`<span class="memdel" title="删除" onclick="delMemory(${m.id})">×</span>`:'<span class="memsrc">自动</span>'}</div>`).join('');
}
async function addMemory() {
  const inp = document.getElementById('memInput'); if(!inp) return;
  const content = (inp.value||'').trim(); if(!content) return;
  inp.value = '';
  try { await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/memory`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content, kind:'preference'})}); }
  catch(e){}
  loadMemory();
}
async function delMemory(id) {
  try { await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/memory/${id}`, {method:'DELETE'}); }
  catch(e){}
  loadMemory();
}

let MATERIALS = null;
function renderMaterials(tab) {
  const box = document.getElementById('materialsBody');
  if (!box) return;
  if (tab === 'archive') {
    box.innerHTML = `<div class="tabbar" style="margin-bottom:12px"><button class="tabbtn active" data-atab="manual">${icon('book',14)} 学习手册</button><button class="tabbtn" data-atab="contract">${icon('target',14)} 愿景与契约</button></div><div class="md card" id="md-body" style="margin-top:0"></div>`;
    const body = document.getElementById('md-body');
    const render = (t)=>{ body.innerHTML = md((t==='manual'?DATA.learning_manual:DATA.vision_contract)||'*（内容缺失）*'); };
    render('manual');
    box.querySelectorAll('[data-atab]').forEach(b=>b.addEventListener('click',()=>{ box.querySelectorAll('[data-atab]').forEach(x=>x.classList.toggle('active',x===b)); render(b.dataset.atab); }));
    return;
  }
  if (tab === 'kb') { renderKB(); return; }
  const m = MATERIALS || {wrong_questions:[], key_cards:[], artifacts:[]};
  if (tab === 'mine') {
    const arts = m.artifacts || [];
    box.innerHTML = arts.length ? arts.map(a=>`<div class="keycard"><div class="kt">${icon('pencil',14)} ${esc(a.topic)}</div>${a.prompt?`<div style="color:var(--ink-faint);font-size:12.5px;margin:4px 0 8px">任务：${esc(a.prompt)}</div>`:''}<div style="white-space:pre-wrap;font-size:14px;line-height:1.7">${esc(a.content)}</div><div style="font-size:11.5px;color:var(--ink-faint);margin-top:8px">${esc((a.created_at||'').slice(0,16).replace('T',' '))}</div></div>`).join('')
      : `<div class="empty">每节学练里"用自己的话主动产出"的内容会沉淀到这里，慢慢攒成你自己的学习作品集。</div>`;
    return;
  }
  if (tab === 'cards') {
    const cards = m.key_cards||[];
    box.innerHTML = cards.length ? cards.map(c=>`<div class="keycard"><div class="kt">${esc(c.title)}</div>${c.summary?`<div class="ks">${md(c.summary)}</div>`:''}${(c.points||[]).length?`<ul>${c.points.map(p=>`<li>${mdi(p)}</li>`).join('')}</ul>`:''}${c.tip?`<div class="tipbox" style="margin-top:8px">${icon('bulb',14)} ${mdi(c.tip)}</div>`:''}</div>`).join('')
      : `<div class="empty">学过的知识点会把核心要点沉淀成卡片，方便随时回看。<br>去完成一节学练就会有了。</div>`;
    return;
  }
  const wq = m.wrong_questions||[];
  box.innerHTML = wq.length ? wq.map(w=>{
    const opts = (w.options||[]).map((o,i)=>{ let cls=''; if(i===w.answer_index)cls='right'; else if(i===w.chosen_index)cls='wrong'; return `<div class="qopt ${cls}">${mdi(o)}${i===w.answer_index?' ✓':(i===w.chosen_index?' ✗ 你选的':'')}</div>`; }).join('');
    return `<div class="qcard"><span class="qtopic">${esc(w.topic)}</span><div class="qbody" style="font-size:15px">${md(w.question)}</div>${opts}${w.why?`<div class="qwhy">${md(w.why)}</div>`:''}<button class="minibtn" style="margin-top:10px" onclick="openLesson('${esc(w.topic).replace(/'/g,'')}')">重学该主题</button></div>`;
  }).join('') : `<div class="empty">还没有错题。做练习答错的题会自动收进这里，方便重做。</div>`;
}

/* ---------- 知识库（RAG 来源管理） ---------- */
let KB = null;
async function loadKB(force) {
  if (KB && !force) return KB;
  try { const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/kb`); KB = res.ok ? await res.json() : {sources:[], dense_enabled:false}; }
  catch(e){ KB = {sources:[], dense_enabled:false}; }
  return KB;
}
async function renderKB() {
  const box = document.getElementById('materialsBody');
  if (!box) return;
  box.innerHTML = `<div class="center" style="padding:30px"><div class="spin"></div></div>`;
  const kb = await loadKB(true);
  const mode = kb.dense_enabled
    ? `${icon('check',13)} 已启用向量检索（dense + BM25 混合）`
    : `当前为 BM25 词法检索；配置 embedding key 后自动升级为向量混合检索。`;
  const srcs = (kb.sources||[]).map(s => `

async function pollLessonResult(topic, jobId='', customInstruction='', loading=null) {
  setLessonAgentNote('请求已转入后台生成，LearnBuddy 正在自动检查结果；生成好后会直接打开。');
  const params = new URLSearchParams({ topic });
  if (jobId) params.set('job_id', jobId);
  if (customInstruction) params.set('custom_instruction', customInstruction);
  for (let i = 0; i < 150; i += 1) {
    await sleep(i === 0 ? 1200 : 4000);
    let data = {};
    try {
      const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/lesson/status?${params.toString()}`);
      if (res.status === 401) { location.href = '/login'; return true; }
      data = await res.json().catch(()=>({}));
      if (loading && typeof loading.update === 'function') loading.update(data);
      if (res.ok && data.status === 'ready' && data.lesson) {
        if (loading) loading.stop();
        renderLesson(data.lesson);
        return true;
      }
      if (res.ok && data.status === 'error' && data.deadline_exceeded) {
        setLessonAgentNote(data.detail || '后台任务仍在运行，LearnBuddy 会继续检查结果。');
        continue;
      }
      if (res.ok && data.status === 'error') {
        if (loading) loading.stop();
        showLessonGenerationError(data.error || data.detail || '后台生成失败，请重试。');
        return true;
      }
    } catch(e) {
      // 临时网络抖动时继续轮询，不立刻打断后台生成。
    }
    const waited = Math.round(((i === 0 ? 1.2 : 1.2 + i * 4)));
    setLessonAgentNote(`后台仍在生成，已自动检查 ${i + 1} 次，等待约 ${waited}s。你可以停留在本页，不需要手动刷新。`);
  }
  if (loading) loading.stop();
  showLessonGenerationError('后台任务可能仍在运行，或结果已经保存但本页暂时没有同步到。你可以先返回学习首页，稍后再进入这一节；如果内容已经保存，系统会自动读取。', {
    title: '后台仍在检查结果',
  });
  return true;
}

    { icon: 'link', name: '整理外部参考来源', desc: '补充权威网页、文档或案例来源，减少空泛生成。', at: 4500 },

function renderLessonAgentLoading(topic, tip, regenerate=false, customInstruction='') {
  const steps = lessonAgentSteps(regenerate, customInstruction);
  const started = Date.now();
  let timer = null;
  let latestServerStatus = null;
  const main = document.getElementById('main');
  main.innerHTML = `<div class="page active"><div class="lesson">
    <div class="lessbar"><span class="back" onclick="go('home')">← 返回学习首页</span><span class="pill teal">学练单元</span></div>
    <div class="stage agent-stage">
      <div class="agent-panel">
        <div class="agent-head">
          <div class="agent-orb">${icon('bolt',20)}</div>
          <div>
            <div class="agent-k">LearnBuddy 正在构建本节学习任务</div>
            <div class="agent-title" id="agentLiveTitle">正在为「${esc(topic)}」准备讲解与练习</div>
            <div class="agent-sub" id="agentLiveDesc">${esc(tip)}</div>
          </div>
          <div class="agent-time" id="agentElapsed">0s</div>
        </div>
        <div class="agent-progress"><span id="agentProgressFill"></span></div>
        <div class="agent-steps" id="agentSteps">
          ${steps.map((s, i) => `<div class="agent-step" data-step="${i}">
            <div class="dot">${icon(s.icon,14)}</div>
            <div><div class="name">${esc(s.name)}</div><div class="desc">${esc(s.desc)}</div></div>
            <div class="state">等待</div>
          </div>`).join('')}
        </div>
        <div class="agent-note"><span class="pulse"></span><span id="agentNote">首次生成会更久一些，因为要检索来源、生成互动内容并做质量审查。</span></div>
      </div>
    </div>
  </div></div>`;
  window.scrollTo(0,0);

  function activeIndex(elapsed) {
    let idx = 0;
    steps.forEach((s, i) => { if (elapsed >= s.at) idx = i; });
    return idx;
  }
  function paint() {
    if (latestServerStatus) {
      applyServerStatus(latestServerStatus);
      return;
    }
    const elapsed = Date.now() - started;
    const idx = activeIndex(elapsed);
    const sec = Math.max(0, Math.floor(elapsed / 1000));
    const fill = document.getElementById('agentProgressFill');
    const title = document.getElementById('agentLiveTitle');
    const desc = document.getElementById('agentLiveDesc');
    const time = document.getElementById('agentElapsed');
    const note = document.getElementById('agentNote');
    if (!fill || !title || !desc || !time || !note) return;
    const pct = Math.min(92, Math.round(((idx + 0.35) / steps.length) * 100));
    fill.style.width = `${pct}%`;
    title.textContent = steps[idx].name;
    desc.textContent = steps[idx].desc;
    time.textContent = `${sec}s`;
    document.querySelectorAll('.agent-step').forEach((el, i) => {
      el.classList.toggle('done', i < idx);
      el.classList.toggle('active', i === idx);
      const state = el.querySelector('.state');
      if (state) state.textContent = i < idx ? '完成' : (i === idx ? '进行中' : '等待');
    });
    note.textContent = sec >= 120
      ? '等待时间已经偏长。如果模型或外部来源没有及时返回，系统会自动停止并给出重试入口。'
      : (sec >= 22
        ? '这节内容仍在生成，通常是来源检索或质检修订耗时较长。你可以停留在本页等待。'
        : '首次生成会更久一些，因为要检索来源、生成互动内容并做质量审查。');
  }
  function applyServerStatus(data) {
    if (!data || typeof data !== 'object') return;
    const fill = document.getElementById('agentProgressFill');
    const title = document.getElementById('agentLiveTitle');
    const desc = document.getElementById('agentLiveDesc');
    const time = document.getElementById('agentElapsed');
    const note = document.getElementById('agentNote');
    if (fill && Number.isFinite(Number(data.progress_percent))) {
      fill.style.width = `${Math.max(8, Math.min(100, Number(data.progress_percent)))}%`;
    }
    if (title && data.stage_label) title.textContent = data.stage_label;
    if (desc && (data.stage_detail || data.detail)) desc.textContent = data.stage_detail || data.detail;
    if (time && Number.isFinite(Number(data.elapsed_seconds))) time.textContent = `${Math.max(0, Number(data.elapsed_seconds))}s`;
    const serverSteps = Array.isArray(data.steps) ? data.steps : [];
    if (serverSteps.length) {
      document.querySelectorAll('.agent-step').forEach((el, i) => {
        const step = serverSteps[i] || {};
        const state = step.status ? step.status : 'waiting';
        el.classList.toggle('done', state === 'done');
        el.classList.toggle('active', state === 'active');
        el.classList.toggle('error', state === 'error');
        const label = el.querySelector('.state');
        if (label) {
          let seconds = Number(step.duration_seconds);
          if (!Number.isFinite(seconds) && state === 'active' && step.started_at) {
            const startedMs = Date.parse(step.started_at);
            if (Number.isFinite(startedMs)) seconds = Math.max(0, Math.round((Date.now() - startedMs) / 1000));
          }
          const suffix = Number.isFinite(seconds) ? ` · ${Math.max(0, Math.round(seconds))}s` : '';
          label.textContent = state === 'done'
            ? `完成${suffix}`
            : (state === 'active' ? `进行中${suffix}` : (state === 'error' ? `已停止${suffix}` : '等待'));
        }
      });
    }
    if (note && data.detail) note.textContent = data.detail;
  }
  paint();
  timer = window.setInterval(paint, 700);
  return {
    update(data) {
      latestServerStatus = data || latestServerStatus;
      applyServerStatus(data);
    },
    stop() {
      if (timer) window.clearInterval(timer);
      timer = null;
    }
  };
}

async function openLesson(topic, regenerate=false, customInstruction='') {
  currentLessonTopic = topic;
  document.querySelectorAll('.nav [data-view]').forEach(button => {
    button.classList.remove('active');
    button.setAttribute('aria-selected', 'false');
  });
  const tip = regenerate
    ? (customInstruction ? `按你的要求重新生成：${customInstruction.slice(0, 60)}` : 'DeepSeek 重新生成，约需几秒')
    : '首次会生成并保存，之后秒开';
  const loading = renderLessonAgentLoading(topic, tip, regenerate, customInstruction);
  let lesson;
  const controller = new AbortController();
  const timeoutId = window.setTimeout(() => controller.abort(), LESSON_FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/lesson`, {
      method: 'POST', signal: controller.signal, headers: {'Content-Type':'application/json'}, body: JSON.stringify({
        topic, regenerate, custom_instruction: customInstruction
      })
    });
    if (res.status === 401) { location.href = '/login'; return; }
    if (res.status === 429) { loading.stop(); const d = await res.json().catch(()=>({})); document.querySelector('.stage').innerHTML = `<div class="center">${esc(d.detail||'额度已用尽')}<br><span class="back" style="margin-top:14px;display:inline-block" onclick="go('home')">← 返回学习首页</span></div>`; return; }
    if (res.status === 202) {
      window.clearTimeout(timeoutId);
      const d = await res.json().catch(()=>({}));
      if (loading && typeof loading.update === 'function') loading.update(d);
      await pollLessonResult(topic, d.job_id || '', customInstruction, loading);
      return;
    }
    if (!res.ok) { loading.stop(); const d = await res.json().catch(()=>({})); showLessonGenerationError(d.detail || `HTTP ${res.status}`); return; }
    lesson = await res.json();
  } catch (e) {
    if (e && e.name === 'AbortError') {
      await pollLessonResult(topic, '', customInstruction, loading);
      return;
    }
    loading.stop();
    showLessonGenerationError(`生成失败：${e && e.message ? e.message : '网络请求异常'}`);
    return;
  } finally {
    window.clearTimeout(timeoutId);
  }
  loading.stop();
  renderLesson(lesson);
}

async function reportLesson(records, selfRate) {

      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ topic: currentLessonTopic, week: curWeek(), answers: records, self_rating: selfRate })
    });
    const d = res.ok ? await res.json().catch(()=>({})) : {};
    if (d.reward && d.reward.awarded && window.showToast) {
      showToast(`完成奖励 +${d.reward.points} 积分`, 'ok');
      loadCreditTop();
    }
    if (d.path_loop && typeof d.path_loop === 'object') {
      DATA.path_loop = d.path_loop;
      const p = pathPreGen();
      if (window.showToast && p.status === 'running') showToast('下一天正在准备，回到学习首页可查看进度', 'ok');

    ANALYTICS = null;                          // 失效缓存，下次进学情重新拉
    GRAPH = null;                              // 掌握度变了 → 路线图重算
  } catch (e) { /* 离线也不挡完成 */ }
  if (prod && prod.content) {                  // 归档"1 产出物"

      await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/artifact`, {

      });

    } catch (e) { /* 归档失败不挡完成 */ }
  }
}

function lessonFlowCards(lesson) {
  const flow = lesson && lesson._lesson_flow;

  const allowed = new Set(['goal', 'source', 'think', 'explain', 'visual', 'compare', 'example', 'check']);
  return elements
    .filter(e => e && typeof e === 'object' && allowed.has(String(e.type || '').toLowerCase()))
    .slice(0, 10)
    .map(e => ({
      id: e.id || '',
      type: e.type,
      title: e.title || e.stage || CARD_TYPE_LABEL[e.type] || '学习环节',
      body: e.body || '',
      items: Array.isArray(e.items) ? e.items : [],
      options: Array.isArray(e.options) ? e.options : [],
      answer: e.answer,
      why: e.why || '',
      quality: e.quality || null,
      source_pack_status: e.source_pack_status || '',
      diagram: e.diagram || null,
      completion_rule: e.completion_rule || '',
      expected_signal: e.expected_signal || '',
      free_input_prompt: e.free_input_prompt || ''
    }));
}
function lessonDesign(lesson) {
  const flowDesign = lesson && lesson._lesson_flow && lesson._lesson_flow.design;

  const design = lesson && lesson.design;
  return design && typeof design === 'object' ? design : {};

function firstThinkCard(lesson) {

}
function designBriefHtml(lesson) {

function stripInlineMarkdown(text) {
  return String(text || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/[>*#_-]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function isAsciiDiagramLine(line) {
  const s = String(line || '').trim();
  if (s.length < 10) return false;
  const chars = (s.match(/[+\-=|<>^v\/\\┌┐└┘├┤┬┴┼─━│]/g) || []).length;
  return chars >= 6 && chars / Math.max(1, s.length) > 0.32;
}

function stripAsciiDiagram(text) {
  return String(text || '')
    .split('\n')
    .filter(line => !isAsciiDiagramLine(line))
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function asciiDiagramNodes(text) {
  const seen = new Set();
  const nodes = [];
  String(text || '').split('\n').forEach(line => {
    if (!line.includes('|')) return;
    const cells = line.split('|')
      .map(x => stripInlineMarkdown(x).replace(/[()（）]/g, '').trim())
      .filter(x => x && !isAsciiDiagramLine(x) && /[\u4e00-\u9fa5A-Za-z]/.test(x));
    cells.forEach(cell => {
      const compact = cell.replace(/\s+/g, ' ').trim();
      if (compact.length < 2 || compact.length > 42 || seen.has(compact)) return;
      seen.add(compact);
      nodes.push({ title: compact, desc: '' });
    });
  });
  return nodes.slice(0, 6);
}

function splitDiagramNodeText(text) {
  const raw = stripInlineMarkdown(text);
  if (!raw) return null;
  const parts = raw.split(/[：:]\s*/);
  if (parts.length > 1 && parts[0].length <= 22) {
    return { title: parts.shift().trim(), desc: parts.join('：').trim() };
  }
  const isParts = raw.split('是');
  if (isParts.length > 1 && isParts[0].length >= 2 && isParts[0].length <= 14) {
    return { title: isParts.shift().trim(), desc: isParts.join('是').trim() };
  }
  const dash = raw.split(/[—-]\s*/);
  if (dash.length > 1 && dash[0].length <= 22) {
    return { title: dash.shift().trim(), desc: dash.join(' - ').trim() };
  }
  return { title: raw.slice(0, 22), desc: raw.length > 22 ? raw.slice(22).trim() : '' };
}

function diagramNodesFromCard(card) {
  const diagram = card && card.diagram && typeof card.diagram === 'object' ? card.diagram : null;
  const diagramNodes = diagram && Array.isArray(diagram.nodes) ? diagram.nodes : [];
  const normalizedDiagramNodes = diagramNodes.map(node => {
    if (!node || typeof node !== 'object') return null;
    const title = stripInlineMarkdown(node.title || node.name || '');
    const desc = stripInlineMarkdown(node.desc || node.note || node.body || '');
    if (!title && !desc) return null;
    return { title: title || desc.slice(0, 22), desc: title ? desc : '' };
  }).filter(Boolean);
  if (normalizedDiagramNodes.length >= 2) return normalizedDiagramNodes.slice(0, 8);

  const items = Array.isArray(card.items) ? card.items : [];
  let nodes = items.map(item => {
    if (item && typeof item === 'object') {
      const title = stripInlineMarkdown(item.title || item.name || item.text || item.source || '');
      const desc = stripInlineMarkdown(item.note || item.summary || item.body || '');
      if (!title && !desc) return null;
      return { title: title || desc.slice(0, 22), desc: title ? desc : '' };
    }
    return splitDiagramNodeText(item);
  }).filter(Boolean);
  if (nodes.length >= 2) return nodes.slice(0, 6);

  const rawText = card.body || card.content || '';
  nodes = asciiDiagramNodes(rawText);
  if (nodes.length >= 2) return nodes;

  const text = stripAsciiDiagram(rawText);
  const lines = text.split(/\n+/).map(x => x.replace(/^[-*\d.\s]+/, '').trim()).filter(Boolean);
  nodes = lines.map(splitDiagramNodeText).filter(Boolean);
  if (nodes.length >= 2) return nodes.slice(0, 6);

  const compact = stripInlineMarkdown(text);
  let chunks = compact.split(/[；;。]\s*/).map(x => x.trim()).filter(x => x.length >= 8);
  if (chunks.length < 2) {
    chunks = compact.split(/(?:——|—|→|->|，|,|、)\s*/).map(x => x.trim()).filter(x => x.length >= 4);
  }
  return chunks.map(splitDiagramNodeText).filter(Boolean).slice(0, 5);
}

function diagramHtml(card, type) {

  const diagram = card && card.diagram && typeof card.diagram === 'object' ? card.diagram : null;

}

async function loadLessonRuntime(topic) {

    const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/lesson/runtime?topic=${encodeURIComponent(topic)}`);
    if (!res.ok) return null;
    return await res.json().catch(() => null);
  } catch (e) {

  }
}

async function persistLessonRuntime(topic, runtime) {

  try {
    await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/lesson/runtime`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ topic, runtime }),
      keepalive: true
    });
  } catch (e) {}
}

function renderLesson(lesson) {
  const steps = [], meta = [];
  steps.push(() => stagePrime(lesson)); meta.push({type:'prime'});
  steps.push(() => stageExplain(lesson)); meta.push({type:'explain'});
  steps.push(() => stageProduce(lesson)); meta.push({type:'produce'});   // 4-2-1 的"2 主动产出"
  if (lesson.lab && (lesson.lab.starter_code || '').trim()) { steps.push(() => stageLab(lesson)); meta.push({type:'lab'}); }
  (lesson.practice||[]).forEach((p, i) => { steps.push(() => stagePractice(lesson, p, i)); meta.push({type:'practice', p, i}); });
  steps.push(() => stageSummary(lesson)); meta.push({type:'summary'});
  let idx = 0;
  let furthest = 0;
  const state = { correct: 0, answered: 0, total: (lesson.practice||[]).length, selfRate: null, records: [], produce: null, practiceAnswers: {}, cardSelections: {}, primeChoice: '', primeCustom: '', completed: false };
  let runtimeSaveTimer = null;
  let runtimeHydrated = false;

  function stepLabel(m, i) {
    const type = (m && m.type) || '';
    if (type === 'prime') return '先想';
    if (type === 'explain') return '看懂';
    if (type === 'produce') return '自己讲';
    if (type === 'lab') return '动手';
    if (type === 'practice') return `练 ${m.i + 1}`;
    if (type === 'summary') return '收束';
    return `第 ${i + 1} 步`;
  }
  function rail() {
    return `<div class="lesson-rail">${meta.map((m, i) =>
      `<button type="button" class="rail-step ${i < idx ? 'done' : (i === idx ? 'on' : '')} ${i <= furthest ? 'reviewable' : 'locked'}" data-step="${i}" ${i <= furthest ? '' : 'disabled'} title="${i <= furthest ? '点击回看这一环节' : '完成前面的环节后解锁'}"><span class="n">${i + 1}/${meta.length}</span>${esc(stepLabel(m, i))}</button>`
    ).join('')}</div>`;
  }
  function stepId(i) {
    const m = meta[i] || {};
    const type = m.type || 'step';
    if (type === 'practice') return `practice-${m.i + 1}`;
    return `${type}-${i + 1}`;
  }
  function snapshotRuntime(status='in_progress') {
    const completedSteps = [];
    for (let i = 0; i <= furthest; i += 1) completedSteps.push(stepId(i));
    const freeInputs = {};
    if (state.primeCustom) freeInputs.prime = state.primeCustom;
    const outputs = {};
    if (state.produce && state.produce.content) outputs.produce = state.produce;
    return {
      status,
      current_step: idx,
      furthest_step: furthest,
      completed_steps: completedSteps,
      selected_options: {
        prime: state.primeChoice || '',
        cards: state.cardSelections || {},
        practice: state.practiceAnswers || {},
        self_rate: state.selfRate || ''
      },
      free_inputs: freeInputs,
      outputs
    };
  }
  function scheduleRuntimeSave(status='in_progress') {
    if (runtimeSaveTimer) window.clearTimeout(runtimeSaveTimer);
    const topic = currentLessonTopic || lesson.topic || '';
    const runtime = snapshotRuntime(status);
    runtimeSaveTimer = window.setTimeout(() => persistLessonRuntime(topic, runtime), 260);
  }
  function hydrateRuntime(runtime) {
    if (!runtime || runtimeHydrated) return;
    runtimeHydrated = true;
    const maxStep = steps.length - 1;
    const savedFurthest = Math.max(0, Math.min(maxStep, Number(runtime.furthest_step) || 0));
    const savedCurrent = Math.max(0, Math.min(savedFurthest, Number(runtime.current_step) || 0));
    furthest = Math.max(furthest, savedFurthest);
    idx = savedCurrent;
    const selected = runtime.selected_options || {};
    state.primeChoice = selected.prime || state.primeChoice || '';
    state.cardSelections = selected.cards && typeof selected.cards === 'object' ? selected.cards : state.cardSelections;
    state.practiceAnswers = selected.practice && typeof selected.practice === 'object' ? selected.practice : state.practiceAnswers;
    state.records = Object.keys(state.practiceAnswers)
      .sort((a,b)=>Number(a)-Number(b))
      .map(k => state.practiceAnswers[k]);
    state.answered = state.records.length;
    state.correct = state.records.filter(r => r.correct).length;
    state.selfRate = selected.self_rate || state.selfRate || null;
    const freeInputs = runtime.free_inputs || {};
    state.primeCustom = freeInputs.prime || state.primeCustom || '';
    const outputs = runtime.outputs || {};
    if (outputs.produce && typeof outputs.produce === 'object') state.produce = outputs.produce;
    paint({ preserveScroll: true });
  }
  function header() {
    const topic = lesson.topic || (lesson.explain && lesson.explain.title) || '本节学习';
    return `<div class="lesson-head">
      <div><div class="k">今天这节</div><div class="t">${esc(topic)}</div></div>
      <div class="s">当前：${esc(stepLabel(meta[idx], idx))}</div>
    </div>`;
  }
  function paint(options={}) {
    const host = document.querySelector('.lesson');
    const savedBadge = lesson._cache_status === 'current'
      ? `<span class="pill" style="background:var(--teal-soft);color:var(--teal-dark)" title="${lesson._cached ? '当前版本缓存，质量门已通过' : '新内容已通过质量门并保存'}">${lesson._cached ? '已保存 · 质量通过' : '新生成 · 质量通过'}</span>`
      : '<span class="pill amber" title="本节没有作为可信缓存复用">未进入可信缓存</span>';
    host.innerHTML = `<div class="lessbar"><span class="back" onclick="go('home')">← 返回学习首页</span><span style="margin-left:auto;display:flex;gap:10px;align-items:center">${savedBadge}<span class="back" onclick="regenLesson()" title="覆盖并重新生成">${icon('refresh',14)} 重新生成</span></span></div>${header()}${rail()}<div id="stageHost"></div>`;
    document.getElementById('stageHost').innerHTML = steps[idx]();
    hl(document.getElementById('stageHost'));
    bindStage();
    const cur = meta[idx];
    if (cur && cur.type === 'lab' && window.__runnoReady !== true && window.__runnoReady !== false) {
      ensureRunno().then(ok => { if (ok && meta[idx] && meta[idx].type === 'lab') paint(); });
    }
    if (!options.preserveScroll) window.scrollTo(0,0);
  }

    paint();
    scheduleRuntimeSave();
  }
  function next() {
    if (idx < steps.length-1) {
      idx++;
      furthest = Math.max(furthest, idx);
      paint();
      scheduleRuntimeSave();
    } else {
      if (!state.completed) {
        addLessonDone();
        reportLesson(state.records, state.selfRate);
        state.completed = true;
        scheduleRuntimeSave('completed');
      }
      go('analytics');
    }
  }

  function bindStage() {
    const cur = meta[idx];
    document.querySelectorAll('.lesson-rail .rail-step.reviewable').forEach(b => b.addEventListener('click', () => goStep(Number(b.dataset.step))));
    const opts = [...document.querySelectorAll('#stageHost .opt')];
    if (cur && cur.type === 'practice' && state.practiceAnswers[cur.i]) {
      const saved = state.practiceAnswers[cur.i];

        const title = document.getElementById('whyTitle');
        if (title) title.innerHTML = saved.correct
          ? `${icon('check',13)} 答对了 · 现在看懂为什么`
          : `${icon('warn',13)} 这个选项容易误导 · 看看差在哪`;
        why.style.display = 'block';
      }
      const nb = document.getElementById('nextBtn'); if (nb) nb.disabled = false;
    }
    opts.forEach(o => o.addEventListener('click', () => {
      if (opts.some(x => x.classList.contains('correct') || x.classList.contains('wrong'))) return;
      const correct = o.dataset.correct === '1';
      o.classList.add(correct ? 'correct' : 'wrong');
      if (!correct) { const ci = document.querySelector('#stageHost .opt[data-correct="1"]'); if (ci) ci.classList.add('correct'); }
      const chosenIndex = opts.indexOf(o);
      if (cur && cur.type === 'practice') {
        const record = {
          question: cur.p.q, options: cur.p.options, answer_index: cur.p.answer,
          chosen_index: chosenIndex, correct, why: cur.p.why || ''
        };
        state.practiceAnswers[cur.i] = record;
        state.records = Object.keys(state.practiceAnswers)
          .sort((a,b)=>Number(a)-Number(b))
          .map(k => state.practiceAnswers[k]);
        state.answered = state.records.length;
        state.correct = state.records.filter(r => r.correct).length;
        scheduleRuntimeSave();
      }
      const why = document.getElementById('why');
      if (why) {
        why.classList.toggle('good', correct);
        why.classList.toggle('bad', !correct);
        const title = document.getElementById('whyTitle');
        if (title) title.innerHTML = correct
          ? `${icon('check',13)} 答对了 · 现在看懂为什么`
          : `${icon('warn',13)} 这个选项容易误导 · 看看差在哪`;
        why.style.display = 'block';
      }
      const nb = document.getElementById('nextBtn'); if (nb) nb.disabled = false;
    }));
    document.querySelectorAll('#stageHost .lesson-card').forEach(card => {
      const cardId = card.dataset.cardId || '';
      const saved = cardId ? state.cardSelections[cardId] : null;
      if (!saved || saved.chosen_index === undefined) return;
      const options = [...card.querySelectorAll('.card-option')];
      const answer = Number(saved.answer_index);
      const chosen = Number(saved.chosen_index);
      if (answer >= 0 && answer < options.length) options[answer].classList.add('correct');
      if (chosen >= 0 && chosen < options.length && chosen !== answer) options[chosen].classList.add('wrong');
      const why = card.querySelector('.card-why');
      if (why) why.classList.add('show');
    });
    document.querySelectorAll('#stageHost .card-option').forEach(btn => btn.addEventListener('click', () => {
      const card = btn.closest('.lesson-card');
      const options = card ? [...card.querySelectorAll('.card-option')] : [];
      if (!options.length || options.some(x => x.classList.contains('correct') || x.classList.contains('wrong'))) return;
      const answer = Number(btn.dataset.answer);
      const chosen = Number(btn.dataset.index);
      const cardId = card ? (card.dataset.cardId || `card-${chosen}`) : `card-${chosen}`;
      if (answer >= 0 && answer < options.length) {
        options.forEach((o, i) => { if (i === answer) o.classList.add('correct'); });
        if (chosen !== answer) btn.classList.add('wrong');
      }
      state.cardSelections[cardId] = { chosen_index: chosen, answer_index: answer, correct: answer >= 0 ? chosen === answer : null };
      const why = card ? card.querySelector('.card-why') : null;
      if (why) why.classList.add('show');
      scheduleRuntimeSave();
    }));
    document.querySelectorAll('#stageHost .selfrate button').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('#stageHost .selfrate button').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); state.selfRate = b.dataset.v;
      const sc = document.getElementById('selfScore'); if (sc) sc.textContent = b.textContent.trim();
      const nb = document.getElementById('nextBtn'); if (nb) nb.disabled = false;
      scheduleRuntimeSave();
    }));
    if (cur && cur.type === 'produce') {
      const pt = document.getElementById('produceText');
      if (pt && state.produce && state.produce.content) pt.value = state.produce.content;
      if (pt) pt.addEventListener('input', () => {
        state.produce = { prompt: (lesson.produce && lesson.produce.task) || '用自己的话复述本节核心', content: pt.value.trim() };
        const nb = document.getElementById('nextBtn'); if (nb) nb.disabled = pt.value.trim().length === 0;
        scheduleRuntimeSave();
      });
      const rb = document.getElementById('revealBtn');
      if (rb) rb.addEventListener('click', () => { const box = document.getElementById('revealBox'); if (box) box.style.display = (box.style.display === 'none' ? 'block' : 'none'); });
      const nb = document.getElementById('nextBtn'); if (nb && pt && pt.value.trim().length > 0) nb.disabled = false;
    }
    if (cur && cur.type === 'prime') {
      const ta = document.getElementById('primeText');
      const nb = document.getElementById('nextBtn');
      const refreshPrime = () => { if (nb) nb.disabled = !(state.primeChoice || (ta && ta.value.trim().length > 0)); };
      if (ta && state.primeCustom) { ta.value = state.primeCustom; }
      if (ta) ta.addEventListener('input', () => { state.primeCustom = ta.value.trim(); refreshPrime(); scheduleRuntimeSave(); });
      document.querySelectorAll('#stageHost .prime-actions button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#stageHost .prime-actions button').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        state.primeChoice = b.dataset.v || b.textContent.trim();
        refreshPrime();
        scheduleRuntimeSave();
      }));
      if (state.primeChoice) {
        document.querySelectorAll('#stageHost .prime-actions button').forEach(b => {
          b.classList.toggle('sel', (b.dataset.v || b.textContent.trim()) === state.primeChoice);
        });
      }
      refreshPrime();
    }
    const nb = document.getElementById('nextBtn'); if (nb) nb.addEventListener('click', () => {
      if (cur && cur.type === 'prime') {
        const pt = document.getElementById('primeText');
        state.primeCustom = pt ? pt.value.trim() : '';
      }
      if (cur && cur.type === 'produce') {
        const pt = document.getElementById('produceText');
        state.produce = { prompt: (lesson.produce && lesson.produce.task) || '用自己的话复述本节核心', content: pt ? pt.value.trim() : '' };
      }
      next();
    });
    if (cur && cur.type === 'summary' && state.selfRate) {
      const btn = document.querySelector(`#stageHost .selfrate button[data-v="${state.selfRate}"]`);
      if (btn) btn.classList.add('sel');
      const nb2 = document.getElementById('nextBtn'); if (nb2) nb2.disabled = false;
    }
  }

  window.__lessonState = state;
  paint();
  loadLessonRuntime(currentLessonTopic || lesson.topic || '').then(hydrateRuntime);
}

function stagePrime(lesson) {
  const e = lesson.explain || {};
  const d = lessonDesign(lesson);
  const think = firstThinkCard(lesson);
  const topic = lesson.topic || e.title || '本节主题';

  const opts = think && Array.isArray(think.options) && think.options.length
    ? think.options.slice(0, 4)
    : [
      '我先说一个直觉判断',

      '我想知道最容易错在哪里'
    ];
  const tip = d.boundary || e.tip || '';

    <div class="prime-box">
      <div class="prime-prompt">${mdi(prompt)}</div>

      <div class="prime-actions">

      </div>

      <div class="prime-helper">选择和补充是两件事：点选项不会覆盖这里的输入，你也可以只选不写。</div>

    <div class="lessfoot"><span style="font-size:13px;color:var(--ink-faint)">先带着问题学，会比直接看讲义更稳</span><button class="btn primary" id="nextBtn" disabled>进入讲解 →</button></div>`;
}

  `).join('')}</div>` : '';

    e.summary ? `<div class="focus-card primary"><div class="label">${icon('target',13)} 核心判断</div><div class="body">${md(e.summary)}</div></div>` : '',
    e.analogy ? `<div class="focus-card"><div class="label">${icon('link',13)} 直觉模型</div><div class="body">${md(e.analogy)}</div></div>` : ''

}

function qualityBox(lesson) {
  const q = lesson && lesson._quality;
  if (!q || q.score === undefined || q.score === null) return '';
  const dims = q.dimension_scores || {};
  const labels = {
    accuracy: '准确',
    depth: '深度',
    pedagogy: '课设',
    source_coverage: '来源',
    interactivity: '互动',
    actionability: '产出',
    rhythm: '节奏'
  };
  const chips = Object.keys(labels).map(k => {
    const d = dims[k] || {};
    const score = Number(d.score);
    if (!Number.isFinite(score)) return '';
    return `<span class="dimchip ${score >= 75 ? 'good' : 'warn'}" title="${esc(d.note || '')}">${esc(labels[k])} ${score}</span>`;
  }).filter(Boolean).join('');
  const pass = q.passed ? '已通过内容质量门' : '内容仍可学习，但质量门提示需要继续优化';
  return `<div class="quality-box"><div class="qh">${icon(q.passed ? 'check' : 'warn',13)} 内容质量 · ${esc(q.score)}/100 <span style="color:var(--ink-soft);font-weight:700">${esc(pass)}</span></div>${chips ? `<div class="dimchips">${chips}</div>` : ''}</div>`;
}

function activityPlanHtml(lesson) {
  const plan = Array.isArray(lesson.activity_plan) ? lesson.activity_plan : [];
  const contract = lesson._session_contract || {};
  const est = Number(lesson.estimated_minutes || 0);
  const target = Number(contract.target_minutes || 0);
  if (!plan.length && !est && !target) return '';
  const total = plan.reduce((sum, x) => sum + (Number(x && x.minutes) || 0), 0);
  const title = est || total || target;
  const rows = plan.slice(0, 7).map((x, i) => {
    const min = Number(x.minutes || 0);
    return `<div class="concept-card rule">
      <div class="label">${icon(i === 0 ? 'book' : 'check',13)} ${esc(x.title || x.type || `活动 ${i + 1}`)}${min ? ` · ${min} 分钟` : ''}</div>
      <div class="body">${mdi(x.task || '')}</div>
    </div>`;
  }).join('');
  return `<div class="quality-box">
    <div class="qh">${icon('clock',13)} 本节学习安排 · ${title ? `${esc(title)} 分钟` : esc(contract.label || '按你的学习时长生成')} <span style="color:var(--ink-soft);font-weight:700">${esc(contract.label || '')}</span></div>
    ${rows ? `<div class="concept-grid">${rows}</div>` : ''}
  </div>`;
}

function citeBox(lesson) {
  const cites = lesson.citations || [];
  const reviewed = lesson._reviewed ? `<span class="aiflag" title="已经过质检 agent 自检（事实/难度/不泄题）" style="margin-left:8px;background:var(--teal-soft);color:var(--teal-dark)">${icon('check',12)} 已自检</span>` : '';
  const sources = lesson._sources || [];
  const sourceList = sources.length ? `<ul style="margin:6px 0 0;padding-left:20px">${sources.map(s => {
    const title = esc(s.title || s.url || '来源');
    const st = s.source_type || s.kind || '';
    return `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${title}</a>` : title}${st ? ` <span style="color:var(--ink-faint)">(${esc(st)})</span>` : ''}</li>`;
  }).join('')}</ul>` : '';
  if (cites.length) {
    return `<div class="citebox">${icon('book',13)} <b>参考来源</b>
      <ul style="margin:6px 0 0;padding-left:20px">${cites.map(c => `<li>${mdi(c)}</li>`).join('')}</ul>
      ${sourceList}
    </div>${reviewed}`;
  }
  if (sources.length) {
    return `<div class="citebox">${icon('book',13)} <b>已参考来源</b>${sourceList}</div>${reviewed}`;
  }
  return `<div class="aiflag">${icon('info',13)} AI 生成讲解，关键事实请自行核对</div>${reviewed}`;
}

function fbBar(topic) {
  const t = esc(topic || '');
  return `<div class="fbbar" data-topic="${t}">
    <span class="fbq">这段讲解有用吗？</span>
    <button class="fbbtn" data-r="up" onclick="sendFeedback(this,'up')">${icon('up',13)} 有用</button>
    <button class="fbbtn" data-r="down" onclick="sendFeedback(this,'down')">${icon('down',13)} 一般</button>
    <button class="fbbtn" data-r="error" onclick="toggleFbReason(this)">${icon('warn',13)} 这里有错</button>
    <span class="fbthanks" style="display:none">${icon('check',12)} 已记录，谢谢</span>
  </div>
  <div class="fbreason" style="display:none">
    <input type="text" placeholder="哪里错了 / 怎么改更好？（可选）" maxlength="500">

}

async function sendFeedback(btnEl, rating) {
  const reason = btnEl.closest('.fbreason');
  const bar = reason ? reason.previousElementSibling : btnEl.closest('.fbbar');
  if (!bar) return;
  const topic = bar.dataset.topic || '';
  const reasonText = reason ? (reason.querySelector('input').value || '').trim() : '';
  bar.querySelectorAll('.fbbtn').forEach(b => {
    const on = b.dataset.r === rating;
    b.classList.toggle('sel', on);
    b.classList.toggle('neg', on && rating !== 'up');
  });
  try {
    await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}/feedback`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ rating, scene: 'lesson', topic, reason: reasonText })
    });
  } catch (e) {}
  const thanks = bar.querySelector('.fbthanks'); if (thanks) thanks.style.display = 'inline-flex';
  if (reason) reason.style.display = 'none';
}

function toggleFbReason(btnEl) {
  const bar = btnEl.closest('.fbbar');
  const reason = bar ? bar.nextElementSibling : null;
  if (reason && reason.classList.contains('fbreason')) {
    const show = reason.style.display === 'none';
    reason.style.display = show ? 'flex' : 'none';
    if (show) reason.querySelector('input').focus();
  }
}

        <ul>
          ${(rubric.length ? rubric : ['能不能一句话说清它解决什么问题？', '能不能讲出一个关键规则或判断？', '能不能造一个不照抄的新例子？']).map(x => `<li>${mdi(x)}</li>`).join('')}
        </ul>
        <div class="produce-check">

      </aside>
    </div>
    <div style="margin-top:10px"><button class="minibtn" id="revealBtn" type="button">${icon('book',13)} 写完了？对照要点自查</button></div>
    <div class="reveal-box" id="revealBox" style="display:none">${ref}</div>

}

const RUNNO_RUNTIMES = { python:'python', py:'python', javascript:'quickjs', js:'quickjs', node:'quickjs', ruby:'ruby', sql:'sqlite', sqlite:'sqlite', c:'clang', cpp:'clangpp', 'c++':'clangpp' };

  return `<div class="stage hero-stage">
    <div class="kicker drill">收束 · 双坐标校准</div><h2>${esc(lesson.topic||'')} · 学完这一节</h2>
    <div class="summary-grid">
      <div class="summary-card"><div class="k">${icon('target',14)} 客观练习</div><div class="v">${st.correct}/${total}</div><div class="lead">独立答对率 ${indepPct}%</div></div>
      <div class="summary-card"><div class="k">${icon('edit',14)} 主动产出</div><div style="font-size:13px;line-height:1.6;margin-top:7px;color:var(--ink-soft)">${prod}</div></div>
    </div>
    <div style="font-size:14px;font-weight:700;margin-top:6px">你现在更接近哪种状态？</div>

    </div>
    <div class="next-steps">
      <div class="next-card">${icon('bar',13)} 完成后会写入学情，影响后续推荐和复习节奏。</div>
      <div class="next-card">${icon('refresh',13)} 如果你选“还不行”，后续会更偏复习和补弱；如果能独立用，会继续推进下一天。</div>
    </div>
    </div>
    <div class="lessfoot"><span style="font-size:13px;color:var(--ink-faint)">选一个自评</span><button class="btn primary" id="nextBtn" disabled>完成本节 ✓</button></div>`;
}

/* ---------- boot ---------- */
async function boot() {
  INSTANCE_ID = getId();
  if (!INSTANCE_ID) { document.getElementById('main').innerHTML = '<div class="center">URL 里找不到学习路径 id</div>'; return; }
  try {
    const res = await fetch(`/api/instance/${encodeURIComponent(INSTANCE_ID)}`);
    if (res.status === 401) { location.href = '/login'; return; }
    if (!res.ok) throw new Error(res.status === 404 ? '学习路径不存在' : (res.status === 403 ? '无权访问' : ('HTTP '+res.status)));
    DATA = await res.json();
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="center">加载失败：${esc(e.message)}<br><a href="/space" style="color:var(--teal)">← 回学习空间</a></div>`;
    return;
  }
  document.getElementById('crumb-name').textContent = (DATA.master.north_star||{}).domain || DATA.id;
  instanceRuntimeReady.then(runtime => {
    if (runtime.edition !== 'personal' && runtime.quota_mode === 'platform') loadCreditTop();
  }).catch(() => {});
  await loadAnalytics();   // 拉服务端已学/学情，路径"已学"标记跨设备一致
  schedulePathLoopPoll();
  // deep link：旧推送 ?view=today 会兼容到学习首页；focus 仍可直接打开主题
  const _qs = new URLSearchParams(location.search);
  go(_qs.get('view') || 'home');
  const _focus = _qs.get('focus');
  if (_focus) setTimeout(() => openLesson(_focus), 500);
}
boot();
async function loadCreditTop() {
  const el = document.getElementById('creditTop');
  if (!el) return;
  try {
    const r = await fetch('/api/usage');
    if (!r.ok) return;
    const d = await r.json();
    const c = d.credits || (d.quota && d.quota.credits) || {};
    el.textContent = `积分 ${fmtTokens(Math.max(0, c.balance || 0))}`;
    el.style.display = '';
  } catch(e) {}
}
// 注册 service worker（收 Web Push；scope=/）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
